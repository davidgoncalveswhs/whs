name: Deploy admin portal

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Write CloudKit config from secrets
        env:
          WHS_SCHOOL_TOKEN: ${{ secrets.WHS_SCHOOL_TOKEN }}
          WHS_CK_ENV: ${{ secrets.WHS_CK_ENV }}
        run: |
          set -euo pipefail
          if [ -z "${WHS_SCHOOL_TOKEN}" ]; then
            echo "Set repository secret WHS_SCHOOL_TOKEN" >&2
            exit 1
          fi
          ENV="${WHS_CK_ENV:-development}"
          python3 - << 'PY'
          import os
          token = os.environ["WHS_SCHOOL_TOKEN"].replace("\\", "\\\\").replace('"', '\\"')
          env = (os.environ.get("WHS_CK_ENV") or "development").replace("\\", "\\\\").replace('"', '\\"')
          path = "docs/index.html"
          text = open(path, encoding="utf-8").read()
          needle = 'window.WHS_SCHOOL_TOKEN=window.WHS_SCHOOL_TOKEN||"";window.WHS_CK_ENV=window.WHS_CK_ENV||"development";'
          if needle not in text:
              raise SystemExit("school connection placeholder missing")
          open("docs/ck-public.js", "w", encoding="utf-8").write(
              f'window.WHS_SCHOOL_TOKEN = "{token}";\nwindow.WHS_CK_ENV = "{env}";\n'
          )
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
