<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WHS">
  <title>WHS</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
  <link rel="icon" href="./app-icon.png" type="image/png" sizes="1024x1024">
  <link rel="apple-touch-icon" href="./app-icon.png">
  <link rel="preconnect" href="https://cdn.apple-cloudkit.com">
  <script src="./config.js"></script>
  <style>
    :root {
      --orange: #E87722;
      --ink: #000;
      --muted: #8E8E93;
      --line: rgba(0,0,0,0.08);
      --paper: #FFFFFF;
      --bg: #F2F2F7;
      --tab: rgba(255,255,255,0.94);
      --soft: #FFF1E6;
      --font-text: "SF Pro Text", "SF Pro", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-display: "SF Pro Display", "SF Pro Text", "SF Pro", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    @font-face { font-family: "SF Pro Text"; src: local("SF Pro Text Regular"), local("SFProText-Regular"), local(".SFNS-Regular"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "SF Pro Text"; src: local("SF Pro Text Medium"), local("SFProText-Medium"), local(".SFNS-Medium"); font-weight: 500; font-style: normal; }
    @font-face { font-family: "SF Pro Text"; src: local("SF Pro Text Semibold"), local("SFProText-Semibold"), local(".SFNS-Semibold"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "SF Pro Text"; src: local("SF Pro Text Bold"), local("SFProText-Bold"), local(".SFNS-Bold"); font-weight: 700; font-style: normal; }
    @font-face { font-family: "SF Pro Text"; src: local("SF Pro Text Heavy"), local("SFProText-Heavy"); font-weight: 800; font-style: normal; }
    @font-face { font-family: "SF Pro Display"; src: local("SF Pro Display Regular"), local("SFProDisplay-Regular"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "SF Pro Display"; src: local("SF Pro Display Medium"), local("SFProDisplay-Medium"); font-weight: 500; font-style: normal; }
    @font-face { font-family: "SF Pro Display"; src: local("SF Pro Display Semibold"), local("SFProDisplay-Semibold"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "SF Pro Display"; src: local("SF Pro Display Bold"), local("SFProDisplay-Bold"); font-weight: 700; font-style: normal; }
    @font-face { font-family: "SF Pro Display"; src: local("SF Pro Display Heavy"), local("SFProDisplay-Heavy"); font-weight: 800; font-style: normal; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-text);
      font-size: 17px;
      line-height: 1.29;
      font-weight: 400;
      letter-spacing: -0.022em;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .app { min-height: 100vh; padding: 12px 20px 96px; }
    .wrap { width: min(1180px, 100%); margin: 0 auto; }
    .top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
      margin-bottom: 18px;
    }
    .brand {
      font-family: var(--font-text);
      color: var(--orange); font-size: 11px; font-weight: 600; letter-spacing: .06em;
    }
    .pill {
      display: flex; align-items: center; justify-content: center; gap: 2px;
      background: white; border-radius: 999px; padding: 5px 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06); flex: none; height: 44px;
    }
    .pill button {
      width: 34px; height: 34px; padding: 0; margin: 0; border: 0;
      background: transparent; border-radius: 50%;
      display: grid; place-items: center; cursor: pointer; color: #111; flex: none;
    }
    .icon { width: 22px; height: 22px; display: block; fill: currentColor; }
    .pill .icon { width: 18px; height: 18px; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; background: #111;
      color: white; display: grid; place-items: center; font-weight: 700; font-size: 13px;
      line-height: 1; letter-spacing: 0; text-align: center; overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .more-face { display: flex; align-items: center; gap: 12px; }
    .more-face .avatar { width: 52px; height: 52px; font-size: 18px; flex: none; }
    h1 {
      font-family: var(--font-display);
      font-size: 34px; letter-spacing: 0.011em; margin: 0 0 6px;
      font-weight: 700; line-height: 1.21;
    }
    .date {
      font-family: var(--font-text);
      color: var(--muted); font-size: 16px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.31;
    }
    .role-chip {
      font-family: var(--font-text);
      display: inline-flex; align-items: center; margin-top: 10px;
      background: var(--soft); color: var(--orange); font-size: 13px; font-weight: 600;
      letter-spacing: -0.008em;
      padding: 6px 10px; border-radius: 999px;
    }
    .dash { display: grid; gap: 14px; grid-template-columns: 1fr; }
    @media (min-width: 820px) {
      .dash { grid-template-columns: 1fr 1fr; }
      .dash .wide { grid-column: 1 / -1; }
    }
    .card {
      background: var(--paper);
      border-radius: 28px;
      padding: 18px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    .action { cursor: pointer; text-align: left; width: 100%; border: 0; font: inherit; color: inherit; display: block; }
    a.card, a.action { text-decoration: none; color: inherit; }
    .action:hover { background: #FAFAFC; }
    .card-title {
      display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;
    }
    .card-title b { font-family: var(--font-text); font-size: 17px; font-weight: 600; letter-spacing: -0.022em; }
    .card-title .link { font-family: var(--font-text); color: var(--orange); font-size: 15px; font-weight: 600; }
    .row-item { display: flex; gap: 12px; align-items: center; width: 100%; min-width: 0; }
    .row-item > div { min-width: 0; flex: 1; }
    .plate {
      width: 34px; height: 34px; border-radius: 10px; background: var(--soft);
      color: var(--orange); display: grid; place-items: center; font-size: 16px; flex: none;
    }
    .t { font-family: var(--font-text); font-size: 17px; font-weight: 600; letter-spacing: -0.022em; }
    .s { font-family: var(--font-text); font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: -0.008em; line-height: 1.38; }
    .wmark {
      width: 34px; height: 34px; border-radius: 10px; background: var(--orange);
      color: white; font-weight: 800; display: grid; place-items: center; flex: none;
    }
    .lock, .chev { margin-left: auto; color: var(--muted); }
    .home-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .pair {
      display: grid; grid-template-columns: 1fr 1px 1fr;
      background: white; border-radius: 28px; min-height: 96px;
      align-items: stretch;
    }
    .pair .mini {
      padding: 16px; display: flex; align-items: center; gap: 10px;
      width: 100%; background: transparent;
    }
    .pair .mini:hover { background: #FAFAFC; }
    .pair .split { width: 1px; background: rgba(0,0,0,0.12); align-self: center; height: 48px; }
    .section { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: 0.016em; margin: 8px 0 0; grid-column: 1 / -1; }
    .shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .shortcut {
      background: white; border-radius: 28px; padding: 16px; min-height: 104px;
      border: 0; text-align: left; font: inherit; cursor: pointer;
      display: flex; flex-direction: column; justify-content: space-between;
      color: inherit; text-decoration: none;
    }
    .shortcut:hover { background: #FAFAFC; }
    .shortcut .plate { width: 34px; height: 34px; border-radius: 10px; }
    .sf-glyph { width: 22px; height: 22px; object-fit: contain; display: block; }
    .tile-wire { width: 34px; height: 34px; object-fit: contain; flex: none; }
    .wire-open {
      display: inline-flex; align-items: center; justify-content: center;
      margin-top: 10px; width: fit-content; max-width: 100%;
      background: var(--orange); color: #fff; text-decoration: none;
      border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 600;
    }
    .shortcut.wire-tile { cursor: default; }
    .news-row {
      display: flex; gap: 12px; align-items: center;
      width: 100%; text-align: left; padding: 12px 0;
      border-bottom: 1px solid var(--line); background: transparent;
    }
    .news-row:last-child { border-bottom: 0; }
    .news-art {
      width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex: none;
      background: var(--soft);
    }
    .news-art.empty { display: grid; place-items: center; color: var(--orange); }
    .news-art.empty .icon { width: 22px; height: 22px; fill: currentColor; }
    .news-full { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 12px; background: #111; }
    .news-compose-preview {
      width: 100%; max-height: 220px; object-fit: contain; display: block;
      border-radius: 12px; background: #F2F2F7; margin: 8px 0 0;
    }
    .admin-post { cursor: default; }
    .news-delete { flex: none; color: #B42318; padding: 8px 12px; }
    .sig-pad {
      width: 100%; height: 140px; border: 1px solid #111; background: #fff;
      border-radius: 8px; touch-action: none; display: block; cursor: crosshair;
    }
    .pass-type {
      display: flex; gap: 8px; margin: 0 0 12px;
    }
    .pass-type button {
      flex: 1; background: #F2F2F7; border-radius: 16px; padding: 12px; font-weight: 700;
    }
    .pass-type button.on { background: var(--orange); color: #fff; }
    button, .btn { appearance: none; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; }
    input, select, textarea {
      width: 100%; padding: 14px; border-radius: 16px; border: 1px solid #E5E5EA;
      font: inherit; background: #F2F2F7;
    }
    .primary {
      background: var(--orange); color: white; width: 100%; border-radius: 16px;
      padding: 14px; font-weight: 700; margin-top: 10px;
    }
    .ghost {
      background: #F2F2F7; border-radius: 16px; padding: 12px 14px; font-weight: 600;
    }
    .muted { font-family: var(--font-text); color: var(--muted); line-height: 1.33; font-size: 15px; letter-spacing: -0.016em; }
    .error { color: #B42318; }
    .ok { color: #1F7A3A; }
    .pass-kind { font-size: 18px; font-weight: 800; letter-spacing: 0.04em; margin: 0 0 10px; }
    .paper {
      background: #fff; border: 2px solid #111; border-radius: 0; padding: 16px;
      text-align: left; width: 100%; box-shadow: none;
    }
    .paper.big { padding: 28px; border-width: 3px; }
    .paper-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .paper-w-img { width: 42px; height: 42px; object-fit: contain; flex: none; }
    .paper.big .paper-w-img { width: 64px; height: 64px; }
    .tile-mark { width: 42px; height: 42px; object-fit: contain; flex: none; }
    .tile-swipe { width: 65px; height: 42px; object-fit: contain; flex: none; }
    .tile-id {
      width: 56px; height: 38px; object-fit: cover; flex: none;
      border-radius: 6px; border: 1px solid var(--line); background: #fff;
    }
    .hero-pass { min-height: 88px; }
    .hero-pass .row-item { min-height: 56px; }
    .id-photo {
      width: 100%; max-width: 420px; display: block;
      border-radius: 22px; border: 1px solid var(--line); background: #fff;
    }
    .id-meta { margin-top: 14px; }
    .id-meta .t { font-size: 20px; }
    .flash {
      min-height: 240px; background: white; border-radius: 28px; padding: 28px;
      display: grid; place-items: center; text-align: center; cursor: pointer;
    }
    .flash b { font-family: var(--font-display); font-size: 34px; font-weight: 700; letter-spacing: 0.011em; }
    .flash .s { font-size: 20px; color: var(--ink); }
    .study-doc { width: 100%; min-height: 72vh; border: 0; border-radius: 16px; background: white; }
    .quiz-choice {
      display: block; width: 100%; text-align: left; background: white; border-radius: 16px;
      padding: 14px; margin-top: 8px; font-weight: 600;
    }
    .quiz-choice:hover { background: #FAFAFC; }
    .ql {
      position: fixed; inset: 0; z-index: 50;
      background: #ff9b70; color: #2e140a; border-radius: 0;
      min-height: 100%; min-height: 100dvh; width: 100%;
      padding: max(10px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column;
    }
    body.ql-open { overflow: hidden; }
    body.ql-open nav.tabs { display: none !important; }
    .ql-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 16px 10px;
    }
    .ql-x {
      width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.10);
      font-weight: 700;
    }
    .ql-count { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .ql-track { height: 2px; background: rgba(0,0,0,0.16); }
    .ql-fill { height: 2px; background: #eb6114; width: 0; }
    .ql-body { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
    .ql-prompt {
      font-family: var(--font-display); font-size: 22px; font-weight: 400;
      padding: 24px 22px; min-height: 160px;
    }
    .ql-pop {
      display: inline-block; color: #fff; font-weight: 600; border-radius: 16px;
      padding: 12px 22px; margin: 8px 22px 0; box-shadow: 0 6px 16px rgba(0,0,0,0.16);
    }
    .ql-pop.ok { background: #2e8c52; }
    .ql-pop.bad { background: #c72e29; }
    .ql-choose { font-weight: 600; padding: 0 18px 10px; }
    .ql-opt {
      display: block; width: calc(100% - 36px); margin: 0 18px 10px; text-align: left;
      border: 1px solid rgba(0,0,0,0.28); border-radius: 12px; padding: 16px; background: transparent;
    }
    .ql-opt.ok { background: rgba(46,140,82,0.18); border-color: #2e8c52; }
    .ql-opt.bad { background: rgba(199,46,41,0.16); border-color: #c72e29; }
    .ql-opt.dim { opacity: 0.45; }
    .ql-go {
      display: block; width: calc(100% - 36px); margin: 8px 18px 0; background: #eb6114;
      color: #fff; border-radius: 12px; padding: 14px; font-weight: 600;
    }
    .ql-summary { text-align: center; padding: 48px 24px; }
    .ql-summary .t { font-size: 22px; }
    .paper-title {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 800; letter-spacing: 0.016em; line-height: 1.1;
    }
    .paper.big .paper-title { font-size: 34px; letter-spacing: 0.011em; }
    .paper-field { margin-bottom: 8px; }
    .paper-field .lab {
      font-family: var(--font-text);
      font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.06em;
    }
    .paper-field .val { font-family: var(--font-text); font-size: 17px; letter-spacing: -0.022em; padding-bottom: 6px; border-bottom: 1px solid #111; min-height: 28px; }
    .paper.big .paper-field .val { font-size: 20px; }
    .paper-sign { margin-top: 8px; }
    .paper-sign img {
      display: block; height: 54px; width: auto; max-width: 100%;
      object-fit: contain; object-position: left center; background: #fff;
    }
    .paper.big .paper-sign img { height: 88px; }
    .sig, .news-img { max-width: 100%; max-height: 220px; margin-top: 8px; border-radius: 12px; }
    .lunch { width: 100%; min-height: 72vh; border: 0; border-radius: 24px; background: white; }
    .search { margin-bottom: 12px; }
    .web-mark {
      display: flex; align-items: center; gap: 10px;
      padding: 0; margin: 0 0 10px; border: 0; background: transparent;
      font-family: var(--font-display); font-size: 20px; font-weight: 800;
      letter-spacing: -0.022em; color: #000; cursor: pointer; text-align: left;
    }
    .web-mark span { color: #000; }
    .web-mark img {
      width: 34px; height: 34px; border-radius: 9px; object-fit: cover; flex: none;
    }
    nav.tabs .web-mark { display: none; }
    nav.tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
      background: var(--tab); backdrop-filter: blur(18px);
      border-top: 1px solid var(--line);
      display: grid; grid-template-columns: repeat(3, 1fr);
      padding: 8px 10px 14px;
    }
    nav.tabs button { font-family: var(--font-text); color: #8E8E93; font-size: 10px; font-weight: 500; letter-spacing: 0.06em; padding: 6px; border-radius: 14px; }
    nav.tabs button.on { color: var(--orange); background: var(--soft); }
    nav.tabs .ico { display: grid; place-items: center; margin: 0 auto 4px; }
    nav.tabs .ico .icon { width: 22px; height: 22px; }
    nav.tabs .tab-glyph { width: 22px; height: 22px; object-fit: contain; display: block; }
    nav.tabs.with-classes { grid-template-columns: repeat(4, 1fr); }
    .hidden { display: none !important; }
    .overlay, .sheet {
      position: fixed; inset: 0; background: var(--bg); z-index: 30; overflow: auto;
    }
    #gate.overlay {
      background: #1a1a1a url("./whs-campus.png") center / cover no-repeat;
      display: grid; place-items: center; padding: 24px;
    }
    .gate-box {
      width: min(720px, calc(100% - 40px));
      margin: 0;
      background: #fff;
      border-radius: 2px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
      overflow: hidden;
    }
    .gate-bar {
      display: flex; align-items: center; gap: 10px;
      background: #E87722; color: #fff;
      padding: 18px 28px;
      font-family: var(--font-text); font-size: 18px; font-weight: 700;
    }
    .gate-bar img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; }
    .gate-body { padding: 34px 40px 40px; --sign-inset: 20px; }
    .gate-title {
      font-family: var(--font-text); font-size: 28px; font-weight: 700;
      margin: 0 0 12px; letter-spacing: -0.022em;
    }
    .gate-copy { margin: 0 0 26px; font-size: 15px; }
    .gate-row {
      display: grid; grid-template-columns: 160px 1fr;
      border: 1px solid #cfd6de; overflow: hidden;
    }
    .gate-row label {
      background: #eef1f4; padding: 14px 16px;
      font-size: 14px; font-weight: 600; display: grid; align-items: center;
    }
    .gate-stack { display: grid; gap: 8px; }
    .gate-row input, .gate-row select {
      border: 0; border-radius: 0; background: #FFF1E6;
      padding: 14px 16px; font-size: 16px; width: 100%;
    }
    .gate-row select { appearance: none; background-image: none; }
    .gate-apple-step {
      display: flex;
      align-items: center;
      min-height: 56px;
      margin: 8px 0 12px;
      overflow: visible;
    }
    .gate-apple-step #ck-auth {
      display: flex;
      align-items: center;
      min-height: 44px;
      overflow: visible;
    }
    .gate-apple-step #ck-auth.hidden { display: none !important; }
    .gate-apple-step .apple-auth-button {
      overflow: hidden !important;
      flex: none;
    }
    .gate-actions {
      display: flex; justify-content: flex-end;
      margin-top: 16px; padding-right: var(--sign-inset);
    }
    .gate-signin {
      background: #E87722; color: #fff; border-radius: 4px;
      padding: 4px 10px; font-size: 12px; font-weight: 700;
      width: auto; min-width: 0; height: auto; line-height: 1.2;
      white-space: nowrap; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .gate-guest {
      margin-top: 28px; border: 1px solid #cfd6de; padding: var(--sign-inset);
    }
    .gate-guest .t { font-size: 18px; margin-bottom: 8px; }
    .gate-guest-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .gate-guest-row .muted { flex: 1; min-width: 0; }
    .gate-hint { margin: 12px 0 0; font-size: 12px; }
    .sheet { background: rgba(0,0,0,0.28); display: grid; place-items: center; padding: 24px; }
    .sheet-card { width: min(560px, 100%); background: white; border-radius: 28px; padding: 22px; }
    .sheet-field { margin: 0 0 12px; }
    .sheet-field span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .wipe-track { height: 10px; background: #ececec; border-radius: 99px; overflow: hidden; margin: 14px 0 8px; }
    .wipe-fill { height: 100%; width: 0; background: #eb6114; border-radius: 99px; transition: width 0.2s ease; }
    .wipe-pct { font-variant-numeric: tabular-nums; font-weight: 700; }
    .home-steps { margin: 12px 0 0; padding-left: 18px; }
    .home-steps li { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
    .id-card {
      background: linear-gradient(160deg, #111 0%, #2A2A2A 100%);
      color: white; border-radius: 22px; padding: 22px; margin: 12px 0 16px;
    }
    .id-card .school { color: var(--orange); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    .lang { display: flex; gap: 6px; }
    .lang button { padding: 6px 10px; border-radius: 999px; background: #F2F2F7; font-size: 13px; font-weight: 700; }
    .lang button.on { background: var(--orange); color: white; }
    .staff {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%;
      background: transparent; text-align: left;
    }
    .staff:last-child { border-bottom: 0; }
    .staff:hover { color: var(--orange); }
    details.admin { background: white; border-radius: 28px; padding: 16px; }
    details.admin summary { cursor: pointer; font-weight: 700; color: var(--muted); font-size: 14px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; grid-column: 1 / -1; }
    .news-grid, .pass-grid, .people-grid {
      display: grid; gap: 14px; grid-template-columns: 1fr;
    }
    .pass-grid .action { text-align: left; width: 100%; }
    .pass-col { display: contents; }
    .pass-slot { display: grid; gap: 8px; }
    .paper-wrap { position: relative; display: block; }
    .paper-wrap.is-revoked .paper { filter: grayscale(1); opacity: 0.48; }
    .pass-revoked-stamp {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      pointer-events: none;
      font-family: var(--font-display);
      font-size: 28px; font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(60, 60, 67, 0.92);
      text-shadow: 0 1px 0 rgba(255,255,255,0.7);
    }
    .pass-day { display: grid; gap: 14px; margin: 0 0 22px; }
    .pass-day .section { margin: 2px 0 0; font-size: 20px; }
    .page-head { margin-bottom: 16px; }
    @media (min-width: 820px) {
      body {
        display: grid; grid-template-columns: 220px minmax(0, 1fr);
        grid-template-rows: minmax(100vh, auto); min-height: 100vh;
      }
      nav.tabs { grid-column: 1; grid-row: 1; }
      .app { grid-column: 2; grid-row: 1; min-width: 0; padding: 28px 36px 36px; }
      .overlay, .sheet, .ql { grid-column: 1 / -1; grid-row: 1; }
      nav.tabs {
        position: sticky; top: 0; height: 100vh; width: 220px;
        grid-template-columns: 1fr; align-content: start; gap: 6px;
        border-top: 0; border-right: 1px solid var(--line);
        padding: 28px 14px;
      }
      nav.tabs button { font-size: 17px; font-weight: 600; letter-spacing: -0.022em; text-align: left; padding: 12px 14px; display: flex; gap: 10px; align-items: center; }
      nav.tabs .ico { display: grid; margin: 0; }
      nav.tabs.with-classes { grid-template-columns: 1fr; }
      nav.tabs .web-mark { display: flex; padding: 0 14px 18px; margin: 0; color: #000; }
      nav.tabs button.web-mark, nav.tabs button.web-mark span { color: #000; }
      .web-mark-inline { display: none; }
      .home-grid { grid-template-columns: 1.15fr .85fr; }
      .home-grid .wide { grid-column: 1 / -1; }
      .shortcuts { grid-template-columns: repeat(4, 1fr); }
      .dash .shortcuts { grid-template-columns: 1fr 1fr; }
      .news-grid { grid-template-columns: repeat(2, 1fr); }
      .pass-grid { grid-template-columns: 1fr 1fr; align-items: start; }
      .pass-col { display: grid; gap: 14px; align-content: start; }
      .people-grid { grid-template-columns: repeat(2, 1fr); }
      .people-grid .card { padding: 8px 16px; }
    }
    @media (min-width: 1400px) {
      .news-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>

    async function collectCampusPassIDs() {
      const names = new Set();
      try {
        const manifest = (await fetchByNames(cloudDb(), [MANIFEST]))[0];
        parsePassIDs(manifest && fieldValue(manifest, "passIDs")).forEach((id) => names.add(id));
      } catch (_) {}
      try {
        (await restQuery(PASS_TYPE, 200)).forEach((record) => {

          if (id && !isPassMarker(record)) names.add(id);
        });
      } catch (_) {}
      (window._passLogList || []).forEach((record) => {

    async function handleClearPassLog() {
      if (!canClearPassLog() || window._passWipeBusy) return;
      const c = t();
      const typed = String((document.getElementById("passWipeCode") || {}).value || "").trim();
      let proof = String(window._passWipeProof || "").trim();
      if (!staffProofShape(proof) && typed) {
        try { proof = await cloudGateAllows("wipe", typed); } catch (_) { proof = ""; }
      }
      if (!staffProofShape(proof)) {
        window._passWipeBusy = false;
        setPassWipeError(c.adminPassWipeBadCode);
        closeSheet();
        return;
      }
      window._passWipeProof = proof;
      window._passWipeBusy = true;
      let ids = [];
      try {
        showPassWipeProgress(4, c.adminPassWipeStepCollect, "", false, false);
        await ensureCloud();
        watchAppleSignIn();
        if (!ckWebAuthToken()) throw Object.assign(new Error("APPLE"), { apple: true });
        showPassWipeProgress(10, c.adminPassWipeStepCollect, "", false, false);
        ids = await collectCampusPassIDs();
        if (ids.length) {
          showPassWipeProgress(18, c.adminPassWipeStepRevoke, `${c.adminPassWipeCount} 0 / ${ids.length}`, false, false);
          await markPassesRevoked(ids);
          for (let i = 0; i < ids.length; i += 1) {
            try { await revokePassRecord(ids[i]); } catch (_) {}
            const pct = 18 + Math.round(((i + 1) / ids.length) * 62);
            showPassWipeProgress(pct, c.adminPassWipeStepRevoke, `${c.adminPassWipeCount} ${i + 1} / ${ids.length}`, false, false);
          }
          showPassWipeProgress(84, c.adminPassWipeStepClear, `${c.adminPassWipeCount} ${ids.length} / ${ids.length}`, false, false);
          await saveClearedPassIDs(ids);
        }
        showPassWipeProgress(92, c.adminPassWipeStepEmpty, "", false, false);
        await emptyPassManifest();
        window._passLogList = [];
        window._revokedPassIDs = new Set(ids.map((id) => id.toLowerCase()));
        window._clearedPassIDs = new Set(ids.map((id) => id.toLowerCase()));
        const ok = document.getElementById("passWipeOk");
        if (ok) {
          ok.textContent = c.adminPassWipeDone;
          ok.classList.remove("hidden");
        }
        setPassWipeError("");
        const code = document.getElementById("passWipeCode");
        if (code) code.value = "";
        window._passWipeProof = "";
        if (view === "passes") await loadPasses();
        window._passWipeBusy = false;
        showPassWipeProgress(100, c.adminPassWipeDone, "", true, false);
      } catch (error) {
        window._passWipeBusy = false;
        const apple = (error && error.apple) || error.message === "APPLE" || isAuthError(error);
        const message = apple ? c.adminPassWipeNeedApple : c.adminPassWipeFail;
        showPassWipeProgress(100, message, "", true, true);
        setPassWipeError(message);
      }
    }

    async function fetchByNames(db, names) {
      try {
        const rest = await restLookup(names);
        if (rest.length) return rest;
      } catch (_) {}
      const unique = [...new Set(names.filter(Boolean).flatMap(lookupNames))];
      if (!unique.length) return [];
      const found = [];
      const remember = (record) => {
        if (!usableRecord(record)) return;
        const id = record.recordName || "";
        if (id && found.some((item) => item.recordName === id)) return;
        found.push(record);
      };
      if (db && typeof db.fetchRecord === "function") {
        for (const name of unique) {
          try { recordsFrom(await db.fetchRecord(name)).forEach(remember); } catch (_) {}
        }
        if (found.length) return found;
      }
      if (db && typeof db.fetchRecords === "function") {
        const attempts = [unique, unique.map((recordName) => ({ recordName })), { records: unique.map((recordName) => ({ recordName })) }];
        for (const argument of attempts) {
          try { recordsFrom(await db.fetchRecords(argument)).forEach(remember); } catch (_) {}
          if (found.length) return found;
        }
      }
      return found;
    }

    function compressSwipePhoto(file) {
      return new Promise((resolve, reject) => {
        if (!file) {
          reject(new Error("no file"));
          return;
        }
        const img = new Image();
        const blobURL = URL.createObjectURL(file);
        img.onload = () => {
          const max = 1400;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const width = Math.max(1, Math.round(img.width * scale));
          const height = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(blobURL);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.onerror = () => {
          URL.revokeObjectURL(blobURL);
          reject(new Error("image"));
        };
        img.src = blobURL;
      });
    }

      window._ql = {

        index: 0,

    function loadQuizletOptions() {
      const ql = window._ql;
      if (!ql || !ql.deck[ql.index]) {
        if (ql) ql.options = [];
        return;
      }
      const item = ql.deck[ql.index];
      if (ql.kind === "aspect" && item.alt) {
        ql.options = [item.answer, item.alt].sort(() => Math.random() - 0.5);
        return;
      }
      const pool = ql.deck.map((pair) => pair.answer).filter((answer) => answer !== item.answer);
      const options = [item.answer];
      while (options.length < Math.min(4, pool.length + 1) && pool.length) {
        const next = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
        if (next && !options.includes(next)) options.push(next);
      }
      ql.options = options.sort(() => Math.random() - 0.5);
    }

    function startQuiz(pairs) {
      const shuffled = pairs.slice().sort(() => Math.random() - 0.5).slice(0, 20);
      const quiz = { order: shuffled, index: 0, correct: 0, choices: shuffled.map((item) => {
        const others = pairs.filter((pair) => pair.back !== item.back).map((pair) => pair.back);
        const options = [item.back];
        while (options.length < 4 && others.length) {
          const next = others.splice(Math.floor(Math.random() * others.length), 1)[0];
          if (next && !options.includes(next)) options.push(next);
        }
        return options.sort(() => Math.random() - 0.5);
      }) };
      window._quiz = quiz;
      return quiz;
    }

    function bindPassSignaturePad() {
      const canvas = document.getElementById("passSigPad");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const ratio = Math.max(1, window.devicePixelRatio || 1);
      const width = Math.max(280, canvas.clientWidth || 520);
      const height = 140;
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "#111";
      ctx.lineWidth = 2.2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      let drawing = false;
      const point = (event) => {
        const rect = canvas.getBoundingClientRect();
        const touch = event.touches && event.touches[0];
        const src = touch || event;
        return { x: src.clientX - rect.left, y: src.clientY - rect.top };
      };
      const start = (event) => {
        event.preventDefault();
        drawing = true;
        window._passSigEmpty = false;
        const p = point(event);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      };
      const move = (event) => {
        if (!drawing) return;
        event.preventDefault();
        const p = point(event);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      };
      const end = () => { drawing = false; };
      canvas.onmousedown = start;
      canvas.onmousemove = move;
      canvas.onmouseup = end;
      canvas.onmouseleave = end;
      canvas.ontouchstart = start;
      canvas.ontouchmove = move;
      canvas.ontouchend = end;
      window._passSigEmpty = true;
      window._passSigPad = canvas;
    }
    function passSignatureFile() {
      const canvas = window._passSigPad || document.getElementById("passSigPad");
      if (!canvas || window._passSigEmpty) return null;
      const out = document.createElement("canvas");
      out.width = canvas.width;
      out.height = canvas.height;
      const ctx = out.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, out.width, out.height);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(canvas, 0, 0);
      try { return dataUrlToFile(out.toDataURL("image/png"), "signature.png"); } catch (_) { return null; }
    }
    function compressPassSignature(file) {
      return new Promise((resolve, reject) => {
        if (!file) {
          reject(new Error("image"));
          return;
        }
        const img = new Image();
        const blobURL = URL.createObjectURL(file);
        const budget = 200 * 240;
        img.onload = () => {
          URL.revokeObjectURL(blobURL);
          let maxW = 1280;
          let maxH = 320;
          let quality = 0.92;
          let dataUrl = "";
          for (let step = 0; step < 12; step += 1) {
            const scale = Math.min(1, maxW / Math.max(1, img.width), maxH / Math.max(1, img.height));
            const width = Math.max(1, Math.round(img.width * scale));
            const height = Math.max(1, Math.round(img.height * scale));
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, width, height);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            ctx.drawImage(img, 0, 0, width, height);
            dataUrl = canvas.toDataURL("image/jpeg", quality);
            if ((dataUrl.split(",")[1] || "").length <= budget) {
              resolve(dataUrl);
              return;
            }
            if (quality > 0.72) quality = Math.max(0.72, quality - 0.04);
            else {
              maxW = Math.max(720, Math.round(maxW * 0.9));
              maxH = Math.max(180, Math.round(maxH * 0.9));
            }
          }
          resolve(dataUrl);
        };
        img.onerror = () => {
          URL.revokeObjectURL(blobURL);
          reject(new Error("image"));
        };
        img.src = blobURL;
      });
    }

    function newPassRecordName() {
      if (crypto.randomUUID) return crypto.randomUUID().toUpperCase();
      const bytes = new Uint8Array(16);
      if (crypto.getRandomValues) crypto.getRandomValues(bytes);
      bytes[6] = (bytes[6] & 0x0f) | 0x40;
      bytes[8] = (bytes[8] & 0x3f) | 0x80;
      const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
      return [hex.slice(0, 8), hex.slice(8, 12), hex.slice(12, 16), hex.slice(16, 20), hex.slice(20)].join("-").toUpperCase();
    }

    function compressNewsIcon(file) {
      return new Promise((resolve, reject) => {
        if (!file) {
          reject(new Error("image"));
          return;
        }
        const img = new Image();
        const blobURL = URL.createObjectURL(file);
        const budget = 40 * 240;
        img.onload = () => {
          URL.revokeObjectURL(blobURL);
          let max = 240;
          let quality = 0.62;
          let dataUrl = "";
          for (let step = 0; step < 10; step += 1) {
            const scale = Math.min(1, max / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            dataUrl = canvas.toDataURL("image/jpeg", quality);
            if ((dataUrl.split(",")[1] || "").length <= budget) {
              resolve(dataUrl);
              return;
            }
            quality = Math.max(0.28, quality - 0.08);
            max = Math.max(80, Math.round(max * 0.78));
          }
          resolve(dataUrl);
        };
        img.onerror = () => {
          URL.revokeObjectURL(blobURL);
          reject(new Error("image"));
        };
        img.src = blobURL;
      });
    }

        }

        if (row && (row.serverErrorCode || row.error)) throw cloudRecordError(result, row);

      };
      if (typeof db.newRecordsBatch === "function") {

    async function restUploadAsset(recordType, fieldName, file, recordName) {
      requireCloudWrite();

      const response = await fetch(restPublicUrl("assets/upload"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tokens: [tokenBody] })
      });
      const payload = await response.json();
      if (payload.serverErrorCode || (payload.tokens && payload.tokens[0] && payload.tokens[0].serverErrorCode)) {
        throw cloudRecordError(payload, payload.tokens && payload.tokens[0]);
      }
      const token = (payload.tokens || [])[0];
      if (!token || !token.url) throw cloudRecordError(payload, token);
      const uploaded = await fetch(token.url, {
        method: "POST",
        body: file
      });
      const text = await uploaded.text();
      let body = {};
      try { body = JSON.parse(text); } catch (_) {
        throw Object.assign(new Error("FAIL"), { reason: "image" });
      }
      if (body.serverErrorCode) throw cloudRecordError(body, body);
      const value = assetFieldValue(body);

      return { recordName: token.recordName || recordName, value };

    function parsePassDate(text) {
      const raw = String(text || "").trim().replace(/[–—]/g, "-");
      if (!raw) return null;
      const start = raw.split(/\s+(?:to|through|thru|al|hasta)\s+/i)[0].split(/\s+-\s+/)[0].trim();
      const tryOne = (value) => {
        const parsed = Date.parse(value);
        if (Number.isNaN(parsed)) return null;
        const date = new Date(parsed);
        return new Date(date.getFullYear(), date.getMonth(), date.getDate());
      };
      return tryOne(start) || tryOne(raw) || (() => {
        const match = raw.match(/([A-Za-z]{3,9}\.?\s+\d{1,2}(?:,?\s+\d{2,4})?|\d{1,2}\/\d{1,2}(?:\/\d{2,4})?|\d{4}-\d{2}-\d{2})/);
        return match ? tryOne(match[1]) : null;
      })();
    }
    function passCreatedStamp(record) {
      const created = record && record.created;
      if (created) {
        if (typeof created.timestamp === "number") return created.timestamp;
        if (typeof created === "number") return created;
        const parsed = Date.parse(created.timestamp || created);
        if (!Number.isNaN(parsed)) return parsed;
      }
      const modified = record && record.modified;
      if (modified && typeof modified.timestamp === "number") return modified.timestamp;
      const field = record && record.fields && record.fields.createdAt;
      const raw = field && Object.prototype.hasOwnProperty.call(field, "value") ? field.value : field;
      if (typeof raw === "number") return raw;
      const fromText = Date.parse(fieldValue(record, "createdAt"));
      return Number.isNaN(fromText) ? 0 : fromText;
    }
    function passDayStamp(record) {
      const fromDates = parsePassDate(fieldValue(record, "dates"));
      if (fromDates) return fromDates.getTime();
      const created = passCreatedStamp(record);
      if (created) {
        const date = new Date(created);
        return new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
      }
      return 0;
    }
    function formatPassDay(stamp) {
      if (!stamp) return t().passNoDate;
      const date = new Date(stamp);
      const loc = lang === "es" ? "es-US" : "en-US";
      let weekday = date.toLocaleDateString(loc, { weekday: "long" });
      weekday = weekday.charAt(0).toUpperCase() + weekday.slice(1);
      const month = date.toLocaleDateString(loc, { month: "short" }).replace(/\.$/, "") + ".";
      const day = date.getDate();
      return lang === "es" ? `${weekday} ${day} ${month}` : `${weekday} ${month} ${day}`;
    }
    function passSearchBlob(record) {

        formatPassDay(stamp),
        date.toLocaleDateString(loc, { weekday: "long" }),
        date.toLocaleDateString(loc, { month: "long" }),
        date.toLocaleDateString(loc, { month: "short" }),
        `${date.getMonth() + 1}/${date.getDate()}/${date.getFullYear()}`,
        `${date.getMonth() + 1}/${date.getDate()}`,
        `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`
      ] : [];
      return [fieldValue(record, "studentName"), fieldValue(record, "destination"), fieldValue(record, "dates")]
        .concat(extras)

          renderStudy();
        }
        if (name === "nextCard") {
          window._cardIndex = (window._cardIndex || 0) + 1;
          if (window._cardIndex >= (window._studyPairs || []).length) window._cardIndex = 0;
          window._cardFlip = false;
          renderStudy();
        }
        if (name === "prevCard") {
          window._cardIndex = (window._cardIndex || 0) - 1;
          if (window._cardIndex < 0) window._cardIndex = Math.max(0, (window._studyPairs || []).length - 1);
          window._cardFlip = false;
          renderStudy();
        }
        if (name === "startQuiz") {
          window._studyMode = { type: "quiz" };
          startQuiz((window._studyPairs || []).filter((pair) => pair.back));
          renderStudy();
        }
        if (name === "quizPick") {
          const quiz = window._quiz;
          if (quiz && quiz.order[quiz.index]) {
            const pick = Number(action.dataset.pick);
            const choices = quiz.choices[quiz.index] || [];
            if (choices[pick] === quiz.order[quiz.index].back) quiz.correct += 1;
            quiz.index += 1;
            renderStudy();
          }
        }
      }
      const go = event.target.closest("[data-go]");
      if (go) show(go.dataset.go);
      const tab = event.target.closest("button[data-view]");
      if (tab) show(tab.dataset.view);
      if (event.target.id === "en") { lang = "en"; localStorage.setItem("whsAdminLang", lang); show(view); }
      if (event.target.id === "es") { lang = "es"; localStorage.setItem("whsAdminLang", lang); show(view); }
      if (event.target.id === "signOutProfile" || event.target.closest("#signOutProfile")) {
        confirmRemoveProfile();
      }
      if (event.target.id === "saveToken") {
        localStorage.setItem("whsAdminToken", document.getElementById("token").value.trim());
        localStorage.setItem("whsAdminEnv", document.getElementById("env").value);
        configured = false;
        const note = document.getElementById("tokenSaved");
        if (note) { note.textContent = t().tokenSaved; note.classList.remove("hidden"); }
      }
      if (event.target.id === "openPasses") show("passes");
      if (event.target.id === "refreshPasses") loadPasses();
      if (event.target.closest("#bell")) show("news");
      if (event.target.closest("#me")) show("more");
      if (event.target.id === "skipSite" || event.target.closest("#skipSite")) showGuestStep();
      if (event.target.id === "guestFinish" || event.target.closest("#guestFinish")) enterGuest();
      if (event.target.id === "enterSite" || event.target.closest("#enterSite")) enterWithCode();
    });
    document.body.addEventListener("input", (event) => {
      if (event.target.id === "staffQuery") renderStaff(event.target.value);
      if (event.target.id === "passQuery") paintPassLog();
    });
    document.body.addEventListener("change", (event) => {
      if (event.target.id === "guestRole") {
        const err = document.getElementById("setupError");
        if (err) err.textContent = "";
        syncGuestRoleFields();
      }
      if (event.target.id === "swipeFile" && event.target.files && event.target.files[0]) {
        handleSwipeFile(event.target.files[0]);
        event.target.value = "";
      }
      if (event.target.id === "newsImage" && event.target.files && event.target.files[0]) {
        handleNewsImage(event.target.files[0]);
        event.target.value = "";
      }
    });
    document.body.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && event.target.id === "askBox") {
        event.preventDefault();
        answerAsk(event.target.value);
      }
      if (event.key === "Enter" && event.target.id === "webCode") {
        event.preventDefault();
        enterWithCode();
      }
      if (event.key === "Enter" && (event.target.id === "guestName" || event.target.id === "guestGrade" || event.target.id === "guestAccess")) {
        event.preventDefault();
        enterGuest();
      }
      if (event.key === "Escape") closeSheet();
    });
    sheet.addEventListener("click", (event) => {
      if (event.target === sheet) closeSheet();
    });
    function showPairStep() {
      window._gateStep = "pair";
      window._pendingGuestStaff = null;
      document.body.classList.remove("whs-apple-gate");
      document.getElementById("gatePair").classList.remove("hidden");
      document.getElementById("gateSetup").classList.add("hidden");
      const apple = document.getElementById("gateApple");
      if (apple) apple.classList.add("hidden");
      parkCkAuth();
      const err = document.getElementById("setupError");
      if (err) err.textContent = "";
      const appleErr = document.getElementById("appleError");
      if (appleErr) appleErr.textContent = "";
    }
    function showGuestStep() {
      window._gateStep = "guest";
      document.getElementById("gatePair").classList.add("hidden");
      document.getElementById("gateSetup").classList.remove("hidden");
      const apple = document.getElementById("gateApple");
      if (apple) apple.classList.add("hidden");
      const access = document.getElementById("guestAccess");
      if (access) access.value = "";
      applyChrome();
      const name = document.getElementById("guestName");
      if (name) name.focus();
    }
    function syncGuestRoleFields() {
      const role = normalizeRole((document.getElementById("guestRole") || {}).value);
      const staff = role === "teacher" || role === "administrator";
      const gradeRow = document.getElementById("guestGradeRow");
      const accessRow = document.getElementById("guestAccessRow");
      if (gradeRow) gradeRow.classList.toggle("hidden", staff);
      if (accessRow) accessRow.classList.toggle("hidden", !staff);
    }
    function pendingStaffFromForm() {
      if (!((window._gateStep === "guest" || window._gateStep === "apple") && gateIsOpen())) return null;
      const name = String((document.getElementById("guestName") || {}).value || "").trim();
      const role = normalizeRole((document.getElementById("guestRole") || {}).value);
      const code = String((document.getElementById("guestAccess") || {}).value || "").trim();
      if ((role !== "teacher" && role !== "administrator") || !name || !code) return null;
      return { name, role, code };
    }
    async function enterGuest() {
      const name = String((document.getElementById("guestName") || {}).value || "").trim();
      const role = normalizeRole((document.getElementById("guestRole") || {}).value);
      const grade = String((document.getElementById("guestGrade") || {}).value || "").trim();
      const code = String((document.getElementById("guestAccess") || {}).value || "").trim();
      const err = document.getElementById("setupError");
      const staff = role === "teacher" || role === "administrator";
      if (!name) {
        if (err) err.textContent = staff ? t().guestNeedStaff : t().guestNeedInfo;
        return;
      }
      if (role !== "student" && role !== "teacher" && role !== "administrator") {
        if (err) err.textContent = t().guestNeedRole;
        return;
      }
      if (role === "student" && !grade) {
        if (err) err.textContent = t().guestNeedInfo;
        return;
      }
      if (staff && !code) {
        if (err) err.textContent = t().guestNeedStaff;
        return;
      }
      if (err) err.textContent = "";
      const finish = document.getElementById("guestFinish");
      if (staff) {
        window._pendingGuestStaff = { name, role, code };
        if (!ckWebAuthToken()) {
          await showAppleStep();
          return;
        }
        if (finish) finish.disabled = true;
        await finishPendingGuestStaff();
        if (finish) finish.disabled = false;
        return;
      } else {
        if (finish) finish.disabled = true;
        const key = await allocateGuestStudentKey({ displayName: name, firstName: name, grade })
          || makeWebUnlockKey();
        if (finish) finish.disabled = false;
        profile = { displayName: name, firstName: name, role: "student", grade, key, guest: true, classes: [] };
      }
      localStorage.setItem("whsWebProfile", JSON.stringify(profile));
      applyAvatar("");
      showGate();
      show("home");
    }
    async function finishPendingGuestStaff() {
      const pending = window._pendingGuestStaff;
      const err = document.getElementById("appleError") || document.getElementById("setupError");
      if (!pending) return;
      if (!ckWebAuthToken()) {
        if (err) err.textContent = t().appleStepBody;
        return;
      }
      if (err) err.textContent = "";
      let proof = "";
      try { proof = await allowStaffGate(pending.code); } catch (error) {
        if (error && error.apple) {
          if (err) err.textContent = t().appleStepBody;
          return;
        }
      }
      if (!proof) {
        if (err) err.textContent = t().staffCodeWrong;
        return;
      }
      let enrolled = "";
      for (let i = 0; i < 4 && !enrolled; i += 1) {
        if (i) await new Promise((resolve) => setTimeout(resolve, 350));
        try { enrolled = await enrollWebStaff(pending.role, pending.code); } catch (error) {
          enrolled = "";
          if (error && error.apple) {
            if (err) err.textContent = t().appleStepBody;
            return;
          }
        }
      }
      if (enrolled !== "teacher" && enrolled !== "administrator") {
        if (err) err.textContent = t().staffAppleFail;
        return;
      }
      window._pendingGuestStaff = null;
      document.body.classList.remove("whs-apple-gate");
      window._gateStep = "pair";
      parkCkAuth();
      profile = {
        displayName: pending.name,
        firstName: pending.name,
        role: enrolled,
        key: "",
        guest: true,
        staffEnrolled: true
      };
      localStorage.setItem("whsWebProfile", JSON.stringify(profile));
      applyAvatar("");
      showGate();
      show("home");
    }
    window.show = show;
    window.openAsk = openAsk;
    window.openAide = openAide;
    window.openPassesInfo = openPassesInfo;
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
    showGate();
    if (signedIn()) {
      enforceGuestStaffProof().then(() => { if (signedIn()) show("home"); }).catch(() => { if (signedIn()) show("home"); });
    }
  </script>
</body>
</html>
