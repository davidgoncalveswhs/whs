<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E87722">
  <title>WHS</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.apple-cloudkit.com">
  <style>
    :root {
      --orange: #E87722;
      --ink: #0F172A;
      --muted: #64748B;
      --line: #E2E8F0;
      --paper: #FFFFFF;
      --bg: #F8FAFC;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-bottom: 84px;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 22px 18px 24px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .brand { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--orange); }
    h1 { font-size: 26px; margin: 4px 0 6px; }
    .sub { color: var(--muted); font-size: 15px; line-height: 1.45; }
    button, .btn {
      appearance: none; border: 0; border-radius: 12px; padding: 10px 14px;
      font: inherit; font-weight: 600; cursor: pointer; background: var(--orange); color: white;
    }
    button.ghost { background: white; color: var(--ink); border: 1px solid var(--line); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
      font: inherit; background: white; color: var(--ink);
    }
    .card {
      background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
      padding: 18px; margin: 12px 0;
    }
    .home-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .tile { text-align: left; width: 100%; background: white; color: var(--ink); border: 1px solid var(--line); padding: 18px; }
    .tile b { display: block; font-size: 17px; margin-bottom: 4px; }
    .tile span { color: var(--muted); font-weight: 500; font-size: 14px; }
    .pass-kind { font-size: 18px; font-weight: 800; letter-spacing: 0.05em; margin: 0 0 12px; }
    .field { margin: 10px 0; }
    .field span { display: block; font-size: 11px; font-weight: 650; color: var(--muted); letter-spacing: 0.04em; }
    .field strong { font-size: 16px; font-weight: 650; }
    .sig, .news-img { max-width: 100%; max-height: 180px; margin-top: 8px; border-radius: 10px; }
    .empty, .error { color: var(--muted); line-height: 1.5; }
    .error { color: #B42318; }
    ol.setup-steps { color: var(--muted); padding-left: 20px; line-height: 1.55; }
    #status { font-size: 13px; color: var(--muted); margin-top: 10px; }
    .hidden { display: none !important; }
    .lang { display: flex; gap: 6px; }
    .lang button { padding: 8px 10px; font-size: 13px; }
    iframe.lunch { width: 100%; min-height: 72vh; border: 1px solid var(--line); border-radius: 18px; background: white; }
    nav.tabs {
      position: fixed; left: 0; right: 0; bottom: 0; background: white;
      border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr);
      padding: 6px 8px 10px;
    }
    nav.tabs button {
      background: transparent; color: var(--muted); box-shadow: none; font-size: 12px; padding: 8px 4px;
    }
    nav.tabs button.on { color: var(--orange); }
    @media (max-width: 560px) { .home-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brand">Watertown High School</div>
        <h1 id="title">WHS</h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <div class="lang">
        <button class="ghost" type="button" id="en">EN</button>
        <button class="ghost" type="button" id="es">ES</button>
      </div>
    </header>

    <section id="view-home"></section>
    <section id="view-news" class="hidden"></section>
    <section id="view-lunch" class="hidden"></section>
    <section id="view-passes" class="hidden">
      <section class="card" id="setup">
        <p id="setupIntro"></p>
        <ol class="setup-steps" id="steps"></ol>
        <div class="field">
          <label for="token" id="tokenLabel">CloudKit API token</label>
          <input id="token" type="password" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="env" id="envLabel">Environment</label>
          <select id="env">
            <option value="development">Development</option>
            <option value="production">Production</option>
          </select>
        </div>
        <div class="row">
          <button type="button" id="save">Open</button>
        </div>
      </section>
      <section id="log" class="hidden">
        <div class="row">
          <button type="button" id="refresh">Refresh</button>
          <button class="ghost" type="button" id="signout">Change token</button>
          <div id="apple-sign-in"></div>
          <div id="apple-sign-out"></div>
        </div>
        <p id="status"></p>
        <div id="passes"></div>
      </section>
    </section>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
  <script>
    const CONTAINER = "iCloud.com.davidgoncalvespersonalteam.UntitledProject";
    const PASS_TYPE = "WHSTeacherPass";
    const NEWS_TYPE = "WHSAnnouncement";
    const MANIFEST = "whs-teacher-pass-manifest";
    const LUNCH = "https://drive.google.com/file/d/1FcyUw6LwftfJC6cDnOQrlXgBXC4UjB57/preview";
    const copy = {
      en: {
        homeTitle: "Home",
        homeSub: "News, lunch, and administrator passes on Chromebook. Study games and hallway passes stay on iPhone.",
        news: "News", newsSub: "School announcements from the WHS app.",
        lunch: "Lunch", lunchSub: "This week’s menu.",
        passes: "Passes", passesSub: "Administrator log of hallway and Flex passes.",
        chromebook: "On a Chromebook, use Chrome → More → Save and share → Create shortcut → Open as window.",
        newsEmpty: "No news yet. Paste the CloudKit token under Passes first, then open News.",
        setup: "Paste the CloudKit API token once on this Chromebook. It stays in this browser. Lunch does not need a token.",
        steps: [
          "CloudKit Dashboard → Tokens & Keys → WHS Admin Portal.",
          "Keep Development selected while testing with Xcode.",
          "World Read must be on for WHSTeacherPass and WHSAnnouncement."
        ],
        token: "CloudKit API token",
        env: "Environment",
        open: "Save and load",
        refresh: "Refresh",
        change: "Change token",
        loading: "Loading…",
        empty: "No passes yet. Sign in with Apple ID if the list stays empty, then Refresh.",
        indexHint: "CloudKit: World Read on WHSTeacherPass, QUERYABLE index on recordName.",
        hallway: "HALLWAY PASS",
        flex: "FLEX PASS",
        student: "STUDENT NAME",
        destination: "DESTINATION",
        dates: "DATE(S)",
        teacher: "TEACHER",
        failed: "Could not load CloudKit data. Check the token and environment."
      },
      es: {
        homeTitle: "Inicio",
        homeSub: "Noticias, almuerzo y pases de administrador en Chromebook. Los juegos y los pases de pasillo se quedan en iPhone.",
        news: "Noticias", newsSub: "Anuncios escolares de la app WHS.",
        lunch: "Almuerzo", lunchSub: "El menú de esta semana.",
        passes: "Pases", passesSub: "Registro de pases de pasillo y Flex.",
        chromebook: "En un Chromebook: Chrome → Más → Guardar y compartir → Crear acceso directo → Abrir como ventana.",
        newsEmpty: "Aún no hay noticias. Pega el token de CloudKit en Pases y luego abre Noticias.",
        setup: "Pega el token de CloudKit una vez en este Chromebook. Se queda en este navegador. El almuerzo no necesita token.",
        steps: [
          "CloudKit Dashboard → Tokens & Keys → WHS Admin Portal.",
          "Deja Development si estás probando con Xcode.",
          "World Read debe estar activo para WHSTeacherPass y WHSAnnouncement."
        ],
        token: "Token de API de CloudKit",
        env: "Entorno",
        open: "Guardar y cargar",
        refresh: "Actualizar",
        change: "Cambiar token",
        loading: "Cargando…",
        empty: "Aún no hay pases. Inicia sesión con Apple ID si la lista sigue vacía y actualiza.",
        indexHint: "CloudKit: World Read en WHSTeacherPass, índice QUERYABLE en recordName.",
        hallway: "PASE DE PASILLO",
        flex: "PASE FLEX",
        student: "NOMBRE DEL ESTUDIANTE",
        destination: "DESTINO",
        dates: "FECHA(S)",
        teacher: "MAESTRO",
        failed: "No se pudieron cargar los datos. Revisa el token y el entorno."
      }
    };

    let lang = localStorage.getItem("whsAdminLang") || "en";
    let configured = false;
    let view = "home";
    function t() { return copy[lang]; }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function field(label, value) {
      if (!value) return "";
      return `<div class="field"><span>${label}</span><strong>${escapeHtml(value)}</strong></div>`;
    }

    function unwrapField(field) {
      if (field == null) return "";
      if (typeof field !== "object") return String(field);
      const value = Object.prototype.hasOwnProperty.call(field, "value") ? field.value : field;
      if (value == null) return "";
      if (typeof value === "number" && (field.type === "TIMESTAMP" || field.type === "DATE" || value > 1000000000000)) {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
      }
      if (value && typeof value === "object" && value.downloadURL) return value.downloadURL;
      return typeof value === "object" ? "" : String(value);
    }

    function fieldValue(record, key) {
      if (!record) return "";
      if (typeof record.get === "function") {
        try {
          const got = record.get(key);
          if (got != null && got !== "") return unwrapField(got);
        } catch (_) {}
      }
      const item = record.fields && record.fields[key];
      if (item != null) return unwrapField(item);
      return "";
    }

    function recordsFrom(response) {
      if (!response) return [];
      if (Array.isArray(response)) return response;
      if (Array.isArray(response.records)) return response.records;
      if (response.recordName) return [response];
      return [];
    }

    async function fetchByNames(db, names) {
      const unique = [...new Set(names.filter(Boolean))];
      if (!unique.length || typeof db.fetchRecords !== "function") return [];
      const attempts = [
        unique,
        unique.map((recordName) => ({ recordName })),
        { records: unique.map((recordName) => ({ recordName })) }
      ];
      for (const argument of attempts) {
        try {
          const response = await db.fetchRecords(argument);
          const list = recordsFrom(response);
          if (list.length) return list;
        } catch (_) {}
      }
      return [];
    }

    function applyLang() {
      const c = t();
      document.documentElement.lang = lang;
      setupIntro.textContent = c.setup;
      steps.innerHTML = c.steps.map((s) => `<li>${s}</li>`).join("");
      tokenLabel.textContent = c.token;
      envLabel.textContent = c.env;
      save.textContent = c.open;
      refresh.textContent = c.refresh;
      signout.textContent = c.change;
      tabs.innerHTML = ["home", "news", "lunch", "passes"].map((id) => {
        const label = id === "home" ? c.homeTitle : c[id];
        return `<button type="button" data-view="${id}" class="${view === id ? "on" : ""}">${label}</button>`;
      }).join("");
      renderView();
    }

    function show(id) {
      view = id;
      ["home", "news", "lunch", "passes"].forEach((name) => {
        document.getElementById("view-" + name).classList.toggle("hidden", name !== id);
      });
      applyLang();
      if (id === "news") loadNews();
      if (id === "passes" && configured) loadPasses();
    }

    function renderView() {
      const c = t();
      const titles = { home: c.homeTitle, news: c.news, lunch: c.lunch, passes: c.passes };
      const subs = { home: c.homeSub, news: c.newsSub, lunch: c.lunchSub, passes: c.passesSub };
      title.textContent = titles[view];
      subtitle.textContent = subs[view];
      document.getElementById("view-home").innerHTML = `
        <p class="sub">${c.chromebook}</p>
        <div class="home-grid">
          <button class="tile" data-go="news"><b>${c.news}</b><span>${c.newsSub}</span></button>
          <button class="tile" data-go="lunch"><b>${c.lunch}</b><span>${c.lunchSub}</span></button>
          <button class="tile" data-go="passes"><b>${c.passes}</b><span>${c.passesSub}</span></button>
        </div>`;
      document.getElementById("view-lunch").innerHTML = `
        <p class="sub"><a href="${LUNCH.replace("/preview", "/view")}" target="_blank" rel="noopener">Open in Drive</a></p>
        <iframe class="lunch" title="Lunch menu" src="${LUNCH}"></iframe>`;
    }

    function renderPasses(records) {
      const c = t();
      const usable = records.filter((r) => {
        const name = r.recordName || "";
        return name && name !== MANIFEST && (fieldValue(r, "studentName") || fieldValue(r, "teacherName"));
      });
      usable.sort((a, b) => new Date(fieldValue(b, "createdAt") || 0) - new Date(fieldValue(a, "createdAt") || 0));
      if (!usable.length) {
        passes.innerHTML = `<p class="empty">${c.empty}</p><p class="empty">${c.indexHint}</p>`;
        return;
      }
      passes.innerHTML = usable.map((record) => {
        const kind = fieldValue(record, "kind") === "flex" ? c.flex : c.hallway;
        const signature = fieldValue(record, "signature");
        const created = fieldValue(record, "createdAt");
        const sig = signature ? `<img class="sig" alt="" src="${escapeHtml(signature)}">` : "";
        return `<article class="card"><p class="pass-kind">${kind}</p>
          ${field(c.student, fieldValue(record, "studentName"))}
          ${field(c.destination, fieldValue(record, "destination"))}
          ${field(c.dates, fieldValue(record, "dates"))}
          ${field(c.teacher, fieldValue(record, "teacherName"))}
          ${field("", created)}${sig}</article>`;
      }).join("");
    }

    function renderNews(records) {
      const c = t();
      const usable = records.filter((r) => {
        const published = Number(fieldValue(r, "published") || 1);
        return published !== 0 && (fieldValue(r, "titleEN") || fieldValue(r, "titleES"));
      });
      usable.sort((a, b) => Number(fieldValue(b, "published") || 0) - Number(fieldValue(a, "published") || 0));
      if (!usable.length) {
        document.getElementById("view-news").innerHTML = `<p class="empty">${c.newsEmpty}</p>`;
        return;
      }
      document.getElementById("view-news").innerHTML = usable.map((record) => {
        const heading = lang === "es"
          ? (fieldValue(record, "titleES") || fieldValue(record, "titleEN"))
          : (fieldValue(record, "titleEN") || fieldValue(record, "titleES"));
        const body = lang === "es"
          ? (fieldValue(record, "subtitleES") || fieldValue(record, "subtitleEN"))
          : (fieldValue(record, "subtitleEN") || fieldValue(record, "subtitleES"));
        const image = fieldValue(record, "image");
        const img = image ? `<img class="news-img" alt="" src="${escapeHtml(image)}">` : "";
        return `<article class="card"><b>${escapeHtml(heading)}</b><p class="sub">${escapeHtml(body)}</p>${img}</article>`;
      }).join("");
    }

    async function ensureCloud() {
      const token = localStorage.getItem("whsAdminToken") || document.getElementById("token").value.trim();
      const environment = localStorage.getItem("whsAdminEnv") || document.getElementById("env").value;
      if (!token) return false;
      if (!configured) {
        CloudKit.configure({
          containers: [{
            containerIdentifier: CONTAINER,
            apiTokenAuth: {
              apiToken: token,
              persist: true,
              signInButton: { id: "apple-sign-in", theme: "black" },
              signOutButton: { id: "apple-sign-out", theme: "black" }
            },
            environment
          }]
        });
        configured = true;
        try { await CloudKit.getDefaultContainer().setUpAuth(); } catch (_) {}
      }
      return true;
    }

    async function loadNews() {
      const node = document.getElementById("view-news");
      node.innerHTML = `<p class="empty">${t().loading}</p>`;
      if (!(await ensureCloud())) {
        node.innerHTML = `<p class="empty">${t().newsEmpty}</p>`;
        return;
      }
      try {
        const queried = await CloudKit.getDefaultContainer().publicCloudDatabase.performQuery({ recordType: NEWS_TYPE });
        renderNews(recordsFrom(queried));
      } catch (error) {
        node.innerHTML = `<p class="error">${escapeHtml(error.message || t().failed)}</p>`;
      }
    }

    async function loadPasses() {
      const c = t();
      status.textContent = c.loading;
      const seen = new Map();
      const remember = (record) => {
        if (record && record.recordName && !record.serverErrorCode) seen.set(record.recordName, record);
      };
      try {
        if (!(await ensureCloud())) return;
        const db = CloudKit.getDefaultContainer().publicCloudDatabase;
        (await fetchByNames(db, [MANIFEST])).forEach(remember);
        const raw = seen.get(MANIFEST) ? fieldValue(seen.get(MANIFEST), "passIDs") : "";
        (await fetchByNames(db, raw.split(",").map((part) => part.trim()).filter(Boolean))).forEach(remember);
        try {
          recordsFrom(await db.performQuery({ recordType: PASS_TYPE })).forEach(remember);
        } catch (_) {}
        status.textContent = "";
        renderPasses([...seen.values()]);
      } catch (error) {
        status.textContent = "";
        passes.innerHTML = `<p class="error">${c.failed}</p><p class="error">${escapeHtml(error.message || "")}</p>`;
      }
    }

    async function openLog() {
      const token = document.getElementById("token").value.trim();
      if (!token) return;
      localStorage.setItem("whsAdminToken", token);
      localStorage.setItem("whsAdminEnv", document.getElementById("env").value);
      setup.classList.add("hidden");
      log.classList.remove("hidden");
      await loadPasses();
    }

    document.getElementById("token").value = localStorage.getItem("whsAdminToken") || "";
    document.getElementById("env").value = localStorage.getItem("whsAdminEnv") || "development";
    if (localStorage.getItem("whsAdminToken")) {
      setup.classList.add("hidden");
      log.classList.remove("hidden");
    }

    tabs.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-view]");
      if (button) show(button.dataset.view);
    });
    document.getElementById("view-home").addEventListener("click", (event) => {
      const tile = event.target.closest("button[data-go]");
      if (tile) show(tile.dataset.go);
    });
    save.addEventListener("click", openLog);
    refresh.addEventListener("click", loadPasses);
    signout.addEventListener("click", () => {
      configured = false;
      log.classList.add("hidden");
      setup.classList.remove("hidden");
    });
    en.addEventListener("click", () => { lang = "en"; localStorage.setItem("whsAdminLang", lang); applyLang(); });
    es.addEventListener("click", () => { lang = "es"; localStorage.setItem("whsAdminLang", lang); applyLang(); });
    applyLang();
  </script>
</body>
</html>
