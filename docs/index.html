<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2F2F7">
  <title>WHS</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
  <link rel="icon" href="./app-icon.png" type="image/png" sizes="1024x1024">
  <link rel="apple-touch-icon" href="./app-icon-192.png">
  <link rel="preconnect" href="https://cdn.apple-cloudkit.com">
  <script src="./config.js"></script>
  <style>
    :root {
      --orange: #E87722;
      --ink: #000;
      --muted: #8E8E93;
      --line: rgba(0,0,0,0.08);
      --paper: #FFFFFF;
      --bg: #F2F2F7;
      --tab: rgba(255,255,255,0.94);
      --soft: #FFF1E6;
      --font-text: "SF Pro Text", "SF Pro", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-display: "SF Pro Display", "SF Pro Text", "SF Pro", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    @font-face { font-family: "SF Pro Text"; src: local("SF Pro Text Regular"), local("SFProText-Regular"), local(".SFNS-Regular"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "SF Pro Text"; src: local("SF Pro Text Medium"), local("SFProText-Medium"), local(".SFNS-Medium"); font-weight: 500; font-style: normal; }
    @font-face { font-family: "SF Pro Text"; src: local("SF Pro Text Semibold"), local("SFProText-Semibold"), local(".SFNS-Semibold"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "SF Pro Text"; src: local("SF Pro Text Bold"), local("SFProText-Bold"), local(".SFNS-Bold"); font-weight: 700; font-style: normal; }
    @font-face { font-family: "SF Pro Text"; src: local("SF Pro Text Heavy"), local("SFProText-Heavy"); font-weight: 800; font-style: normal; }
    @font-face { font-family: "SF Pro Display"; src: local("SF Pro Display Regular"), local("SFProDisplay-Regular"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "SF Pro Display"; src: local("SF Pro Display Medium"), local("SFProDisplay-Medium"); font-weight: 500; font-style: normal; }
    @font-face { font-family: "SF Pro Display"; src: local("SF Pro Display Semibold"), local("SFProDisplay-Semibold"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "SF Pro Display"; src: local("SF Pro Display Bold"), local("SFProDisplay-Bold"); font-weight: 700; font-style: normal; }
    @font-face { font-family: "SF Pro Display"; src: local("SF Pro Display Heavy"), local("SFProDisplay-Heavy"); font-weight: 800; font-style: normal; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-text);
      font-size: 17px;
      line-height: 1.29;
      font-weight: 400;
      letter-spacing: -0.022em;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .app { min-height: 100vh; padding: 12px 20px 96px; }
    .wrap { width: min(1180px, 100%); margin: 0 auto; }
    .top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
      margin-bottom: 18px;
    }
    .brand {
      font-family: var(--font-text);
      color: var(--orange); font-size: 11px; font-weight: 600; letter-spacing: .06em;
    }
    .pill {
      display: flex; align-items: center; justify-content: center; gap: 2px;
      background: white; border-radius: 999px; padding: 5px 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06); flex: none; height: 44px;
    }
    .pill button {
      width: 34px; height: 34px; padding: 0; margin: 0; border: 0;
      background: transparent; border-radius: 50%;
      display: grid; place-items: center; cursor: pointer; color: #111; flex: none;
    }
    .icon { width: 22px; height: 22px; display: block; fill: currentColor; }
    .pill .icon { width: 18px; height: 18px; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; background: #111;
      color: white; display: grid; place-items: center; font-weight: 700; font-size: 13px;
      line-height: 1; letter-spacing: 0; text-align: center;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 34px; letter-spacing: 0.011em; margin: 0 0 6px;
      font-weight: 700; line-height: 1.21;
    }
    .date {
      font-family: var(--font-text);
      color: var(--muted); font-size: 16px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.31;
    }
    .role-chip {
      font-family: var(--font-text);
      display: inline-flex; align-items: center; margin-top: 10px;
      background: var(--soft); color: var(--orange); font-size: 13px; font-weight: 600;
      letter-spacing: -0.008em;
      padding: 6px 10px; border-radius: 999px;
    }
    .dash { display: grid; gap: 14px; grid-template-columns: 1fr; }
    @media (min-width: 820px) {
      .dash { grid-template-columns: 1fr 1fr; }
      .dash .wide { grid-column: 1 / -1; }
    }
    .card {
      background: var(--paper);
      border-radius: 28px;
      padding: 18px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    .action { cursor: pointer; text-align: left; width: 100%; border: 0; font: inherit; color: inherit; }
    .action:hover { background: #FAFAFC; }
    .card-title {
      display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;
    }
    .card-title b { font-family: var(--font-text); font-size: 17px; font-weight: 600; letter-spacing: -0.022em; }
    .card-title .link { font-family: var(--font-text); color: var(--orange); font-size: 15px; font-weight: 600; }
    .row-item { display: flex; gap: 12px; align-items: center; }
    .plate {
      width: 34px; height: 34px; border-radius: 10px; background: var(--soft);
      color: var(--orange); display: grid; place-items: center; font-size: 16px; flex: none;
    }
    .t { font-family: var(--font-text); font-size: 17px; font-weight: 600; letter-spacing: -0.022em; }
    .s { font-family: var(--font-text); font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: -0.008em; line-height: 1.38; }
    .wmark {
      width: 34px; height: 34px; border-radius: 10px; background: var(--orange);
      color: white; font-weight: 800; display: grid; place-items: center; flex: none;
    }
    .lock, .chev { margin-left: auto; color: var(--muted); }
    .home-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .pair {
      display: grid; grid-template-columns: 1fr 1px 1fr;
      background: white; border-radius: 28px; min-height: 96px;
      align-items: stretch;
    }
    .pair .mini {
      padding: 16px; display: flex; align-items: center; gap: 10px;
      width: 100%; background: transparent;
    }
    .pair .mini:hover { background: #FAFAFC; }
    .pair .split { width: 1px; background: rgba(0,0,0,0.12); align-self: center; height: 48px; }
    .section { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: 0.016em; margin: 8px 0 0; grid-column: 1 / -1; }
    .shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .shortcut {
      background: white; border-radius: 28px; padding: 16px; min-height: 104px;
      border: 0; text-align: left; font: inherit; cursor: pointer;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .shortcut:hover { background: #FAFAFC; }
    button, .btn { appearance: none; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; }
    input, select, textarea {
      width: 100%; padding: 14px; border-radius: 16px; border: 1px solid #E5E5EA;
      font: inherit; background: #F2F2F7;
    }
    .primary {
      background: var(--orange); color: white; width: 100%; border-radius: 16px;
      padding: 14px; font-weight: 700; margin-top: 10px;
    }
    .ghost {
      background: #F2F2F7; border-radius: 16px; padding: 12px 14px; font-weight: 600;
    }
    .muted { font-family: var(--font-text); color: var(--muted); line-height: 1.33; font-size: 15px; letter-spacing: -0.016em; }
    .error { color: #B42318; }
    .ok { color: #1F7A3A; }
    .pass-kind { font-size: 18px; font-weight: 800; letter-spacing: 0.04em; margin: 0 0 10px; }
    .paper {
      background: #fff; border: 2px solid #111; border-radius: 0; padding: 16px;
      text-align: left; width: 100%; box-shadow: none;
    }
    .paper.big { padding: 28px; border-width: 3px; }
    .paper-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .paper-w-img { width: 42px; height: 42px; object-fit: contain; flex: none; }
    .paper.big .paper-w-img { width: 64px; height: 64px; }
    .tile-mark { width: 42px; height: 42px; object-fit: contain; flex: none; }
    .tile-swipe { width: 65px; height: 42px; object-fit: contain; flex: none; }
    .tile-id {
      width: 56px; height: 38px; object-fit: cover; flex: none;
      border-radius: 6px; border: 1px solid var(--line); background: #fff;
    }
    .hero-pass { min-height: 88px; }
    .hero-pass .row-item { min-height: 56px; }
    .id-photo {
      width: 100%; max-width: 420px; display: block;
      border-radius: 22px; border: 1px solid var(--line); background: #fff;
    }
    .id-meta { margin-top: 14px; }
    .id-meta .t { font-size: 20px; }
    .flash {
      min-height: 240px; background: white; border-radius: 28px; padding: 28px;
      display: grid; place-items: center; text-align: center; cursor: pointer;
    }
    .flash b { font-family: var(--font-display); font-size: 34px; font-weight: 700; letter-spacing: 0.011em; }
    .flash .s { font-size: 20px; color: var(--ink); }
    .study-doc { width: 100%; min-height: 72vh; border: 0; border-radius: 16px; background: white; }
    .quiz-choice {
      display: block; width: 100%; text-align: left; background: white; border-radius: 16px;
      padding: 14px; margin-top: 8px; font-weight: 600;
    }
    .quiz-choice:hover { background: #FAFAFC; }
    .paper-title {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 800; letter-spacing: 0.016em; line-height: 1.1;
    }
    .paper.big .paper-title { font-size: 34px; letter-spacing: 0.011em; }
    .paper-field { margin-bottom: 8px; }
    .paper-field .lab {
      font-family: var(--font-text);
      font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.06em;
    }
    .paper-field .val { font-family: var(--font-text); font-size: 17px; letter-spacing: -0.022em; padding-bottom: 6px; border-bottom: 1px solid #111; min-height: 28px; }
    .paper.big .paper-field .val { font-size: 20px; }
    .paper-sign { margin-top: 8px; }
    .paper-sign img { max-height: 54px; max-width: 100%; display: block; }
    .paper.big .paper-sign img { max-height: 88px; }
    .sig, .news-img { max-width: 100%; max-height: 220px; margin-top: 8px; border-radius: 12px; }
    .lunch { width: 100%; min-height: 72vh; border: 0; border-radius: 24px; background: white; }
    .search { margin-bottom: 12px; }
    nav.tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
      background: var(--tab); backdrop-filter: blur(18px);
      border-top: 1px solid var(--line);
      display: grid; grid-template-columns: repeat(3, 1fr);
      padding: 8px 10px 14px;
    }
    nav.tabs button { font-family: var(--font-text); color: #8E8E93; font-size: 10px; font-weight: 500; letter-spacing: 0.06em; padding: 6px; border-radius: 14px; }
    nav.tabs button.on { color: var(--orange); background: var(--soft); }
    nav.tabs .ico { display: grid; place-items: center; margin: 0 auto 4px; }
    nav.tabs .ico .icon { width: 22px; height: 22px; }
    .hidden { display: none !important; }
    .overlay, .sheet {
      position: fixed; inset: 0; background: var(--bg); z-index: 30; overflow: auto;
    }
    .gate-box { width: min(520px, calc(100% - 40px)); margin: 72px auto; }
    .sheet { background: rgba(0,0,0,0.28); display: grid; place-items: center; padding: 24px; }
    .sheet-card { width: min(560px, 100%); background: white; border-radius: 28px; padding: 22px; }
    .id-card {
      background: linear-gradient(160deg, #111 0%, #2A2A2A 100%);
      color: white; border-radius: 22px; padding: 22px; margin: 12px 0 16px;
    }
    .id-card .school { color: var(--orange); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    .lang { display: flex; gap: 6px; }
    .lang button { padding: 6px 10px; border-radius: 999px; background: #F2F2F7; font-size: 13px; font-weight: 700; }
    .lang button.on { background: var(--orange); color: white; }
    .staff {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%;
      background: transparent; text-align: left;
    }
    .staff:last-child { border-bottom: 0; }
    .staff:hover { color: var(--orange); }
    details.admin { background: white; border-radius: 28px; padding: 16px; }
    details.admin summary { cursor: pointer; font-weight: 700; color: var(--muted); font-size: 14px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .news-grid, .pass-grid, .people-grid {
      display: grid; gap: 14px; grid-template-columns: 1fr;
    }
    .pass-grid .action { text-align: left; width: 100%; }
    .page-head { margin-bottom: 16px; }
    @media (min-width: 820px) {
      body { display: grid; grid-template-columns: 220px 1fr; }
      .app { padding: 28px 36px 36px; }
      nav.tabs {
        position: sticky; top: 0; height: 100vh; width: 220px;
        grid-template-columns: 1fr; align-content: start; gap: 6px;
        border-top: 0; border-right: 1px solid var(--line);
        padding: 28px 14px;
      }
      nav.tabs button { font-size: 17px; font-weight: 600; letter-spacing: -0.022em; text-align: left; padding: 12px 14px; display: flex; gap: 10px; align-items: center; }
      nav.tabs .ico { display: grid; margin: 0; }
      .home-grid { grid-template-columns: 1.15fr .85fr; }
      .home-grid .wide { grid-column: 1 / -1; }
      .shortcuts { grid-template-columns: repeat(4, 1fr); }
      .news-grid, .pass-grid { grid-template-columns: repeat(2, 1fr); }
      .people-grid { grid-template-columns: repeat(2, 1fr); }
      .people-grid .card { padding: 8px 16px; }
    }
    @media (min-width: 1400px) {
      .news-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <nav class="tabs" id="tabs"></nav>
  <div class="app">
    <div class="wrap">
      <div class="top">
        <div>
          <div class="brand">WATERTOWN HIGH SCHOOL</div>
          <h1 id="hello"></h1>
          <div class="date" id="dateLine"></div>
          <div class="role-chip" id="roleLine"></div>
        </div>
        <div class="pill">
          <button type="button" id="bell" aria-label="News"></button>
          <button type="button" id="me" aria-label="More"><span class="avatar" id="avatar">W</span></button>
        </div>
      </div>

      <section id="view-home"></section>
      <section id="view-news" class="hidden"></section>
      <section id="view-lunch" class="hidden"></section>
      <section id="view-contacts" class="hidden"></section>
      <section id="view-more" class="hidden"></section>
      <section id="view-passes" class="hidden"></section>
      <section id="view-mypasses" class="hidden"></section>
      <section id="view-swipe" class="hidden"></section>
      <section id="view-classes" class="hidden"></section>
      <section id="view-class" class="hidden"></section>
      <section id="view-study" class="hidden"></section>
    </div>
  </div>

  <div class="overlay" id="gate">
    <div class="gate-box">
      <div class="brand">WATERTOWN HIGH SCHOOL</div>
      <h1 id="gateTitle">Welcome</h1>
      <p class="muted" id="gateBody">Paste your WHS Web Code from the iPhone app. This Chromebook loads your name, grade, and role.</p>
      <div class="card">
        <label class="muted" id="codeLabel">WHS Web Code</label>
        <input id="webCode" autocomplete="off" spellcheck="false" placeholder="XXXXX-XXXXX" style="margin-top:8px;">
        <button class="primary" type="button" id="enterSite">Load my profile</button>
        <button class="ghost" type="button" id="skipSite" style="width:100%;margin-top:8px;">Continue as guest</button>
        <div id="gateTokenBox" class="hidden" style="margin-top:12px;">
          <label class="muted" id="gateTokenLabel">School CloudKit token</label>
          <input id="gateToken" type="password" autocomplete="off" style="margin-top:8px;">
          <label class="muted" id="gateEnvLabel" style="display:block;margin-top:8px;">Environment</label>
          <select id="gateEnv" style="margin-top:8px;">
            <option value="development">Development</option>
            <option value="production">Production</option>
          </select>
        </div>
        <p class="error" id="gateError"></p>
      </div>
      <p class="muted" id="gateHint">On iPhone: Account → Chromebook. Student, Teacher, Parent, and Administrator each get a different dashboard. Guest is a limited student view.</p>
    </div>
  </div>
  <div class="sheet hidden" id="sheet">
    <div class="sheet-card" id="sheetCard"></div>
  </div>

  <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>

    function unwrapField(field) {
      if (field == null) return "";
      if (typeof field !== "object") return String(field);
      const value = Object.prototype.hasOwnProperty.call(field, "value") ? field.value : field;
      if (value == null) return "";
      if (typeof value === "number" && value > 1000000000000) return new Date(value).toLocaleString();
      if (value && value.downloadURL) return value.downloadURL;
      return typeof value === "object" ? "" : String(value);
    }
    function fieldValue(record, key) {
      if (!record) return "";
      if (typeof record.get === "function") {
        try {
          const got = record.get(key);
          if (got != null && got !== "") return unwrapField(got);
        } catch (_) {}
      }
      if (record[key] != null && record[key] !== "") return unwrapField(record[key]);
      return unwrapField(record.fields && record.fields[key]);
    }
    function recordsFrom(response) {
      if (!response) return [];
      if (Array.isArray(response)) return response;
      if (Array.isArray(response.records)) return response.records;
      if (response.recordName) return [response];
      return [];
    }

    async function ensureCloud() {
      const token = schoolToken();
      if (!token) return false;
      if (!configured) {
        CloudKit.configure({
          containers: [{
            containerIdentifier: CONTAINER,
            apiTokenAuth: {
              apiToken: token,
              persist: true,
              signInButton: { id: "apple-sign-in-placeholder", theme: "black" },
              signOutButton: { id: "apple-sign-out-placeholder", theme: "black" }
            },
            environment: schoolEnv()
          }]
        });
        configured = true;
        try { await CloudKit.getDefaultContainer().setUpAuth(); } catch (_) {}
      }
      return true;
    }

    function codeNames(value) {
      const compact = normalizeCode(value);
      const names = [compact, String(value || "").trim().toUpperCase()];
      if (compact.length === 10) names.push(compact.slice(0, 5) + "-" + compact.slice(5));
      return [...new Set(names.filter(Boolean))];
    }
    function usableRecord(record) {
      if (!record || record.deleted || record.serverErrorCode) return false;
      return !!(record.recordName || record.recordType || (record.fields && Object.keys(record.fields).length));
    }
    async function fetchByNames(db, names) {
      const unique = [...new Set(names.filter(Boolean).flatMap(codeNames))];
      if (!unique.length) return [];
      const found = [];
      const remember = (record) => {
        if (!usableRecord(record)) return;
        const id = record.recordName || "";
        if (id && found.some((item) => item.recordName === id)) return;
        found.push(record);
      };
      if (typeof db.fetchRecord === "function") {
        for (const name of unique) {
          try { recordsFrom(await db.fetchRecord(name)).forEach(remember); } catch (_) {}
        }
        if (found.length) return found;
      }
      if (typeof db.fetchRecords === "function") {
        const attempts = [unique, unique.map((recordName) => ({ recordName })), { records: unique.map((recordName) => ({ recordName })) }];
        for (const argument of attempts) {
          try { recordsFrom(await db.fetchRecords(argument)).forEach(remember); } catch (_) {}
          if (found.length) return found;
        }
      }
      return found;
    }

      { id: "spanishPreteriteSheet", file: "./study/Spanish-Preterite-Study-Sheet.pdf", kind: "pdf" },
      { id: "spanishPreteriteImperfect", file: "./study/Spanish-Preterite-Imperfect-Uses.pdf", kind: "pdf" }
    ];
    const FILE_TITLES = {
      en: {
        spanishSerEstar: "Ser vs Estar",
        spanishBootVerbs: "Boot verbs",
        spanishVocabPacket: "Español 1 Vocab Packet",
        spanishPreteriteSheet: "Preterite study sheet",
        spanishPreteriteImperfect: "Preterite and imperfect"
      },
      es: {
        spanishSerEstar: "Ser vs Estar",
        spanishBootVerbs: "Verbos de bota",
        spanishVocabPacket: "Paquete de vocabulario de Español 1",
        spanishPreteriteSheet: "Hoja de pretérito",
        spanishPreteriteImperfect: "Pretérito e imperfecto"
      }
    };

    function parseStudy(raw) {
      if (!raw) return { classes: [], spanish: {}, english: {} };
      try {
        const parsed = JSON.parse(raw);
        return {
          classes: Array.isArray(parsed.classes) ? parsed.classes : [],
          spanish: parsed.spanish && typeof parsed.spanish === "object" ? parsed.spanish : {},
          english: parsed.english && typeof parsed.english === "object" ? parsed.english : {}
        };
      } catch (_) {
        return { classes: [], spanish: {}, english: {} };
      }
    }

    function studyState() {
      return window._study || { classes: [], spanish: {}, english: {} };
    }

    function classById(id) {
      return studyState().classes.find((item) => item.id === id);
    }

    function notebooksFor(course) {
      if (!course) return [];
      const key = course.id;
      const cat = String(course.category || "").toLowerCase();
      const pack = cat === "spanish" ? studyState().spanish[key] : cat === "english" ? studyState().english[key] : null;
      return (pack && pack.folders) || [];
    }

    function resourcesFor(course) {
      const c = t();
      const cat = String(course.category || "").toLowerCase();
      if (cat === "spanish") {
        return [
          { id: "vocabularyScanner", title: c.vocabScanner, kind: "spanishVocab" },
          { id: "spanishStudyGames", title: c.studyGames, kind: "spanishVocab" },
          { id: "spanishStudyFolder", title: c.studyFolder, kind: "folder" },
          { id: "spanishPronunciation", title: c.pronunciation, kind: "phone" },
          { id: "spanishStoryReader", title: c.storyReader, kind: "phone" }
        ];
      }
      if (cat === "english") {
        return [
          { id: "englishVocabScanner", title: c.vocabScanner, kind: "englishVocab" },
          { id: "englishDefinitionQuiz", title: c.englishQuiz, kind: "englishQuiz" },
          { id: "englishStudyGames", title: c.studyGames, kind: "englishVocab" },
          { id: "englishQuoteBank", title: c.quoteBank, kind: "phone" }
        ];
      }
      if (cat === "publishing") return [{ id: "publishingInterviews", title: c.interviews, kind: "phone" }];
      if (cat === "math") return [{ id: "mathStudyGames", title: c.mathGames, kind: "phone" }];
      return [];
    }

    function applyClassTile() {
      const tileSub = document.getElementById("classTileSub");
      if (!tileSub) return;
      const courses = studyState().classes;
      if (!courses.length) {
        tileSub.textContent = t().classesSub;
        return;
      }
      tileSub.textContent = courses.length === 1
        ? (courses[0].subject || t().classesTile)
        : `${courses.length} ${t().classesTile}`;
    }

    function renderClasses() {
      const node = document.getElementById("view-classes");
      if (!(node && view === "classes")) return;
      const courses = studyState().classes;
      if (!courses.length) {
        node.innerHTML = `${backBar()}<div class="card wide"><p class="muted" style="margin:0;">${t().noClasses}</p></div>`;
        return;
      }
      node.innerHTML = backBar() + `<div class="dash">` + courses.map((course) => `
        <button class="card action" type="button" data-action="openClass" data-class-id="${escapeHtml(course.id)}">
          <div class="t">${escapeHtml(course.subject || t().classesTile)}</div>
          <div class="s">${escapeHtml([course.teacher, course.courseLevel, course.room].filter(Boolean).join(" · "))}</div>
        </button>`).join("") + `</div>`;
    }

    function renderClassDetail() {
      const node = document.getElementById("view-class");
      if (!(node && view === "class")) return;
      const course = classById(window._classID);
      const c = t();
      if (!course) {
        node.innerHTML = `${backBar()}<div class="card wide"><p class="muted" style="margin:0;">${c.noClasses}</p></div>`;
        return;
      }
      const resources = resourcesFor(course);
      const classroom = String(course.classroomURL || "").trim();
      const classroomHref = classroom && !/^https?:/i.test(classroom) ? `https://${classroom}` : classroom;
      node.innerHTML = `
        <div class="toolbar"><button class="ghost" type="button" data-go="classes">${c.back}</button></div>
        <div class="card wide">
          <div class="t">${escapeHtml(course.subject || "")}</div>
          <div class="s">${escapeHtml([course.teacher, course.courseLevel, course.category, course.letterGrade].filter(Boolean).join(" · "))}</div>
          ${classroomHref ? `<p><a href="${escapeHtml(classroomHref)}" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;">${c.classroom}</a></p>` : ""}
        </div>
        <p class="section">${c.resources}</p>
        <div class="dash">${resources.length ? resources.map((resource) => `
          <button class="card action" type="button" data-action="openResource" data-resource="${escapeHtml(resource.id)}" data-class-id="${escapeHtml(course.id)}">
            <div class="t">${escapeHtml(resource.title)}</div>
            <div class="s">${resource.kind === "phone" ? c.openOnPhone : c.classesBody}</div>
          </button>`).join("") : `<div class="card wide"><p class="muted" style="margin:0;">${c.noResources}</p></div>`}</div>`;
    }

    function listCards(folders, kind) {
      const c = t();
      const rows = [];
      (folders || []).forEach((folder) => {
        (folder.lists || []).forEach((list) => {
          const count = (list.entries || []).length;
          rows.push(`<button class="card action" type="button" data-action="openList" data-kind="${kind}" data-folder="${escapeHtml(folder.id)}" data-list="${escapeHtml(list.id)}">
            <div class="t">${escapeHtml(list.name || folder.name || c.flashcards)}</div>
            <div class="s">${escapeHtml(folder.name || "")} · ${count}</div>
          </button>`);
        });
      });
      return rows.join("") || `<div class="card wide"><p class="muted" style="margin:0;">${c.noWords}</p></div>`;
    }

    function pairsFromList(kind, folderID, listID) {
      const course = classById(window._classID);
      const folders = notebooksFor(course);
      const list = (folders.find((folder) => folder.id === folderID) || { lists: [] }).lists.find((item) => item.id === listID);
      const entries = (list && list.entries) || [];
      if (kind === "english" || kind === "englishQuiz") {
        return entries.filter((entry) => entry.word).map((entry) => ({ front: entry.word, back: entry.definition || "" }));
      }
      return entries.filter((entry) => entry.spanish).map((entry) => ({ front: entry.spanish, back: entry.english || "" }));
    }

    function renderStudy() {
      const node = document.getElementById("view-study");
      if (!(node && view === "study")) return;
      const c = t();
      const back = `<div class="toolbar"><button class="ghost" type="button" data-action="openClass" data-class-id="${escapeHtml(window._classID || "")}">${c.back}</button></div>`;
      const mode = window._studyMode || {};
      if (mode.type === "phone") {
        node.innerHTML = `${back}<div class="card wide"><p class="muted" style="margin:0;">${c.openOnPhone}</p></div>`;
        return;
      }
      if (mode.type === "folder") {
        const titles = FILE_TITLES[lang] || FILE_TITLES.en;
        node.innerHTML = back + `<div class="dash">` + SPANISH_FILES.map((file) => `
          <button class="card action" type="button" data-action="openFile" data-file="${escapeHtml(file.file)}" data-kind="${file.kind}" data-title="${escapeHtml(titles[file.id] || file.id)}">
            <div class="t">${escapeHtml(titles[file.id] || file.id)}</div>
          </button>`).join("") + `</div>`;
        return;
      }
      if (mode.type === "file") {
        const body = mode.kind === "image"
          ? `<img class="id-photo" alt="" src="${escapeHtml(mode.file)}">`
          : `<iframe class="study-doc" title="${escapeHtml(mode.title || "")}" src="${escapeHtml(mode.file)}"></iframe>`;
        node.innerHTML = `${back}<div class="card wide"><div class="t">${escapeHtml(mode.title || "")}</div>${body}</div>`;
        return;
      }
      if (mode.type === "lists") {
        const course = classById(window._classID);
        node.innerHTML = back + `<div class="dash">` + listCards(notebooksFor(course), mode.kind) + `</div>`;
        return;
      }
      if (mode.type === "cards" || mode.type === "quiz") {
        const pairs = window._studyPairs || [];
        if (!pairs.length) {
          node.innerHTML = `${back}<div class="card wide"><p class="muted" style="margin:0;">${c.noWords}</p></div>`;
          return;
        }
        if (mode.type === "quiz") {
          renderQuiz(node, back, pairs);
          return;
        }
        const index = Math.max(0, Math.min(window._cardIndex || 0, pairs.length - 1));
        window._cardIndex = index;
        const pair = pairs[index];
        const shown = window._cardFlip ? pair.back || " " : pair.front;
        node.innerHTML = `${back}
          <div class="s" style="margin-bottom:8px;">${index + 1} / ${pairs.length}</div>
          <button class="flash action" type="button" data-action="flipCard"><b>${escapeHtml(shown)}</b><div class="s">${window._cardFlip ? "" : c.tapReveal}</div></button>
          <div class="toolbar">
            <button class="ghost" type="button" data-action="prevCard">${c.previous}</button>
            <button class="ghost" type="button" data-action="nextCard">${c.next}</button>
            <button class="ghost" type="button" data-action="startQuiz">${c.quiz}</button>
          </div>`;
        return;
      }
      node.innerHTML = `${back}<div class="card wide"><p class="muted" style="margin:0;">${c.noResources}</p></div>`;
    }

    function renderQuiz(node, back, pairs) {
      const c = t();
      const defined = pairs.filter((pair) => pair.back);
      if (defined.length < 2) {
        node.innerHTML = `${back}<div class="card wide"><p class="muted" style="margin:0;">${c.noWords}</p></div>`;
        return;
      }
      const quiz = window._quiz || startQuiz(defined);
      if (quiz.index >= quiz.order.length) {
        node.innerHTML = `${back}<div class="card wide"><div class="t">${c.quizDone}</div><div class="s">${c.correct}: ${quiz.correct} / ${quiz.order.length}</div></div>`;
        return;
      }
      const current = quiz.order[quiz.index];
      const choices = quiz.choices[quiz.index] || [];
      node.innerHTML = `${back}
        <div class="s">${quiz.index + 1} / ${quiz.order.length}</div>
        <div class="card wide"><div class="t">${escapeHtml(current.front)}</div></div>
        ${choices.map((choice, i) => `<button class="quiz-choice" type="button" data-action="quizPick" data-pick="${i}">${escapeHtml(choice)}</button>`).join("")}
        <p class="muted" id="quizNote"></p>`;
    }

    function startQuiz(pairs) {
      const shuffled = pairs.slice().sort(() => Math.random() - 0.5).slice(0, 20);
      const quiz = { order: shuffled, index: 0, correct: 0, choices: shuffled.map((item) => {
        const others = pairs.filter((pair) => pair.back !== item.back).map((pair) => pair.back);
        const options = [item.back];
        while (options.length < 4 && others.length) {
          const next = others.splice(Math.floor(Math.random() * others.length), 1)[0];
          if (next && !options.includes(next)) options.push(next);
        }
        return options.sort(() => Math.random() - 0.5);
      }) };
      window._quiz = quiz;
      return quiz;
    }

    function openResource(classID, resourceID) {
      window._classID = classID;
      const course = classById(classID);
      const resource = resourcesFor(course || { category: "" }).find((item) => item.id === resourceID);
      if (!resource || resource.kind === "phone") {
        window._studyMode = { type: "phone" };
      } else if (resource.kind === "folder") {
        window._studyMode = { type: "folder" };
      } else if (resource.kind === "englishQuiz") {
        window._studyMode = { type: "lists", kind: "englishQuiz" };
      } else if (resource.kind === "englishVocab") {
        window._studyMode = { type: "lists", kind: "english" };
      } else {
        window._studyMode = { type: "lists", kind: "spanish" };
      }
      show("study");
      renderStudy();
    }

      applyClassTile();
      if (currentRole() !== "student" || !profile || !profile.key) {
        if (view === "classes") renderClasses();
        if (view === "class") renderClassDetail();
        return;
      }
      if (!(await ensureCloud())) {
        applyClassTile();
        if (view === "classes") renderClasses();
        if (view === "class") renderClassDetail();
        return;

      try {
        const db = CloudKit.getDefaultContainer().publicCloudDatabase;
        const profiles = await fetchByNames(db, [profile.key]);
        const mine = profiles.find((item) => normalizeCode(item.recordName) === profile.key);
        window._study = parseStudy(fieldValue(mine, "studyJSON"));
        applyClassTile();
        if (view === "classes") renderClasses();
        if (view === "class") renderClassDetail();

      }
      const seen = new Map();
      const remember = (record) => { if (record && record.recordName) seen.set(record.recordName, record); };
      try {
        const db = CloudKit.getDefaultContainer().publicCloudDatabase;
        (await fetchByNames(db, [MANIFEST])).forEach(remember);
        const raw = seen.get(MANIFEST) ? fieldValue(seen.get(MANIFEST), "passIDs") : "";
        (await fetchByNames(db, raw.split(",").map((part) => part.trim()))).forEach(remember);
        try { recordsFrom(await db.performQuery({ recordType: PASS_TYPE })).forEach(remember); } catch (_) {}
        const usable = [...seen.values()].filter((r) => r.recordName !== MANIFEST && (fieldValue(r, "studentName") || fieldValue(r, "teacherName")));
        window._passRecords = {};
        document.getElementById("passes").innerHTML = usable.length ? `<div class="pass-grid">` + usable.map((record) => {
          const id = record.recordName || fieldValue(record, "recordName") || String(Math.random());
          window._passRecords[id] = record;
          return `<button type="button" class="action" data-action="openPass" data-pass-id="${escapeHtml(id)}">${passPaper(record, false)}</button>`;
        }).join("") + `</div>` : `<div class="card"><p class="muted">${c.emptyPasses}</p></div>`;
      } catch (error) {
        node.insertAdjacentHTML("beforeend", `<p class="error">${escapeHtml(error.message)}</p>`);
      }
    }

    async function enterWithCode() {
      gateError.textContent = "";
      const typedToken = document.getElementById("gateToken") && document.getElementById("gateToken").value.trim();
      const typedEnv = document.getElementById("gateEnv") && document.getElementById("gateEnv").value;
      if (typedToken) {
        localStorage.setItem("whsAdminToken", typedToken);
        configured = false;
      }
      if (typedEnv) localStorage.setItem("whsAdminEnv", typedEnv);
      const key = normalizeCode(webCode.value);
      if (key.length < 8) {
        gateError.textContent = t().gateFail;
        return;
      }
      if (!schoolToken()) {
        const box = document.getElementById("gateTokenBox");
        if (box) box.classList.remove("hidden");
        gateError.textContent = t().needToken;
        return;
      }
      if (!(await ensureCloud())) {
        const box = document.getElementById("gateTokenBox");
        if (box) box.classList.remove("hidden");
        gateError.textContent = t().needToken;
        return;
      }
      try {
        const records = await fetchByNames(CloudKit.getDefaultContainer().publicCloudDatabase, [key]);
        const record = records.find((item) => codeNames(item.recordName).includes(key));
        if (!record) {
          const box = document.getElementById("gateTokenBox");
          if (box) box.classList.remove("hidden");
          gateError.textContent = t().gateFail;
          return;
        }
        const role = normalizeRole(fieldValue(record, "role"));
        if (!role) {
          gateError.textContent = t().gateFail;
          return;
        }
        profile = {
          displayName: fieldValue(record, "displayName") || fieldValue(record, "firstName") || "Warrior",
          firstName: fieldValue(record, "firstName") || "",
          role,
          grade: fieldValue(record, "grade") || "",
          key
        };
        localStorage.setItem("whsWebProfile", JSON.stringify(profile));
        showGate();
        show("home");
      } catch (error) {
        const box = document.getElementById("gateTokenBox");
        if (box) box.classList.remove("hidden");
        gateError.textContent = error.message || t().gateFail;
      }
    }

    fetch("./staff.json").then((res) => res.json()).then((data) => {
      staff = data;
      if (view === "contacts") renderStaff("");
    }).catch(() => {});

    document.body.addEventListener("click", (event) => {
      const mail = event.target.closest("[data-mail]");
      if (mail && mail.dataset.mail) {
        window.location.href = mail.dataset.mail;
        return;
      }
      const action = event.target.closest("[data-action]");
      if (action) {
        const name = action.dataset.action;
        if (name === "swipe") show("swipe");
        if (name === "passesInfo") openPassesInfo();
        if (name === "ask") openAsk("");
        if (name === "aide") openAide();
        if (name === "askGo") answerAsk(document.getElementById("askBox") && document.getElementById("askBox").value);
        if (name === "closeSheet") closeSheet();
        if (name === "openPass" || name === "openStudentPass") openPass(action.dataset.passId || "");
        if (name === "openClass") {
          window._classID = action.dataset.classId || "";
          show("class");
        }
        if (name === "openResource") openResource(action.dataset.classId || "", action.dataset.resource || "");
        if (name === "openList") {
          window._studyPairs = pairsFromList(action.dataset.kind || "spanish", action.dataset.folder || "", action.dataset.list || "");
          window._cardIndex = 0;
          window._cardFlip = false;
          window._quiz = null;
          window._studyMode = action.dataset.kind === "englishQuiz" ? { type: "quiz" } : { type: "cards" };
          if (window._studyMode.type === "quiz") startQuiz(window._studyPairs.filter((pair) => pair.back));
          show("study");
          renderStudy();
        }
        if (name === "openFile") {
          window._studyMode = { type: "file", file: action.dataset.file, kind: action.dataset.kind, title: action.dataset.title };
          show("study");
          renderStudy();
        }
        if (name === "flipCard") {
          window._cardFlip = !window._cardFlip;
          renderStudy();
        }
        if (name === "nextCard") {
          window._cardIndex = (window._cardIndex || 0) + 1;
          if (window._cardIndex >= (window._studyPairs || []).length) window._cardIndex = 0;
          window._cardFlip = false;
          renderStudy();
        }
        if (name === "prevCard") {
          window._cardIndex = (window._cardIndex || 0) - 1;
          if (window._cardIndex < 0) window._cardIndex = Math.max(0, (window._studyPairs || []).length - 1);
          window._cardFlip = false;
          renderStudy();
        }
        if (name === "startQuiz") {
          window._studyMode = { type: "quiz" };
          startQuiz((window._studyPairs || []).filter((pair) => pair.back));
          renderStudy();
        }
        if (name === "quizPick") {
          const quiz = window._quiz;
          if (quiz && quiz.order[quiz.index]) {
            const pick = Number(action.dataset.pick);
            const choices = quiz.choices[quiz.index] || [];
            if (choices[pick] === quiz.order[quiz.index].back) quiz.correct += 1;
            quiz.index += 1;
            renderStudy();
          }
        }
      }
      const go = event.target.closest("[data-go]");
      if (go) show(go.dataset.go);
      const tab = event.target.closest("button[data-view]");
      if (tab) show(tab.dataset.view);
      if (event.target.id === "en") { lang = "en"; localStorage.setItem("whsAdminLang", lang); show(view); }
      if (event.target.id === "es") { lang = "es"; localStorage.setItem("whsAdminLang", lang); show(view); }
      if (event.target.id === "signOutProfile") {
        localStorage.removeItem("whsWebProfile");
        profile = null;
        showGate();
      }
      if (event.target.id === "saveToken") {
        localStorage.setItem("whsAdminToken", document.getElementById("token").value.trim());
        localStorage.setItem("whsAdminEnv", document.getElementById("env").value);
        configured = false;
        const note = document.getElementById("tokenSaved");
        if (note) { note.textContent = t().tokenSaved; note.classList.remove("hidden"); }
      }
      if (event.target.id === "openPasses") show("passes");
      if (event.target.id === "refreshPasses") loadPasses();
      if (event.target.closest("#bell")) show("news");
      if (event.target.closest("#me")) show("more");
      if (event.target.id === "skipSite" || event.target.closest("#skipSite")) enterGuest();
      if (event.target.id === "enterSite" || event.target.closest("#enterSite")) enterWithCode();
    });
    document.body.addEventListener("input", (event) => {
      if (event.target.id === "staffQuery") renderStaff(event.target.value);
    });
    document.body.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && event.target.id === "askBox") {
        event.preventDefault();
        answerAsk(event.target.value);
      }
      if (event.key === "Enter" && event.target.id === "webCode") {
        event.preventDefault();
        enterWithCode();
      }
      if (event.key === "Escape") closeSheet();
    });
    sheet.addEventListener("click", (event) => {
      if (event.target === sheet) closeSheet();
    });
    function enterGuest() {
      profile = { displayName: "Warrior", role: "guest", grade: "", key: "" };
      localStorage.setItem("whsWebProfile", JSON.stringify(profile));
      showGate();
      show("home");
    }
    window.show = show;
    window.openAsk = openAsk;
    window.openAide = openAide;
    window.openPassesInfo = openPassesInfo;
    showGate();
    if (signedIn()) show("home");
  </script>
</body>
</html>
