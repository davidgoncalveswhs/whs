<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2F2F7">
  <title>WHS</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.apple-cloudkit.com">
  <script src="./config.js"></script>
  <style>
    :root {
      --orange: #E87722;
      --ink: #000;
      --muted: #8E8E93;
      --line: rgba(0,0,0,0.08);
      --paper: #FFFFFF;
      --bg: #F2F2F7;
      --tab: rgba(255,255,255,0.94);
      --soft: #FFF1E6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .app { min-height: 100vh; padding: 12px 20px 96px; }
    .wrap { width: min(1180px, 100%); margin: 0 auto; }
    .top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
      margin-bottom: 18px;
    }
    .brand {
      color: var(--orange); font-size: 11px; font-weight: 800; letter-spacing: .08em;
    }
    .pill {
      display: flex; align-items: center; justify-content: center; gap: 2px;
      background: white; border-radius: 999px; padding: 5px 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06); flex: none; height: 44px;
    }
    .pill button {
      width: 34px; height: 34px; padding: 0; margin: 0; border: 0;
      background: transparent; border-radius: 50%;
      display: grid; place-items: center; cursor: pointer; color: #111; flex: none;
    }
    .icon { width: 22px; height: 22px; display: block; fill: currentColor; }
    .pill .icon { width: 18px; height: 18px; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; background: #111;
      color: white; display: grid; place-items: center; font-weight: 700; font-size: 13px;
      line-height: 1; letter-spacing: 0; text-align: center;
    }
    h1 {
      font-size: clamp(32px, 4vw, 44px); letter-spacing: -0.04em; margin: 0 0 6px;
      font-weight: 800; line-height: 1.05;
    }
    .date { color: var(--muted); font-size: 16px; font-weight: 500; }
    .role-chip {
      display: inline-flex; align-items: center; margin-top: 10px;
      background: var(--soft); color: var(--orange); font-size: 13px; font-weight: 700;
      padding: 6px 10px; border-radius: 999px;
    }
    .dash { display: grid; gap: 14px; grid-template-columns: 1fr; }
    @media (min-width: 820px) {
      .dash { grid-template-columns: 1fr 1fr; }
      .dash .wide { grid-column: 1 / -1; }
    }
    .card {
      background: var(--paper);
      border-radius: 28px;
      padding: 18px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    .action { cursor: pointer; text-align: left; width: 100%; border: 0; font: inherit; color: inherit; }
    .action:hover { background: #FAFAFC; }
    .card-title {
      display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;
    }
    .card-title b { font-size: 17px; }
    .card-title .link { color: var(--orange); font-size: 15px; font-weight: 600; }
    .row-item { display: flex; gap: 12px; align-items: center; }
    .plate {
      width: 34px; height: 34px; border-radius: 10px; background: var(--soft);
      color: var(--orange); display: grid; place-items: center; font-size: 16px; flex: none;
    }
    .t { font-size: 16px; font-weight: 600; }
    .s { font-size: 13px; color: var(--muted); }
    .wmark {
      width: 34px; height: 34px; border-radius: 10px; background: var(--orange);
      color: white; font-weight: 800; display: grid; place-items: center; flex: none;
    }
    .lock, .chev { margin-left: auto; color: var(--muted); }
    .home-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .pair {
      display: grid; grid-template-columns: 1fr 1px 1fr;
      background: white; border-radius: 28px; min-height: 96px;
      align-items: stretch;
    }
    .pair .mini {
      padding: 16px; display: flex; align-items: center; gap: 10px;
      width: 100%; background: transparent;
    }
    .pair .mini:hover { background: #FAFAFC; }
    .pair .split { width: 1px; background: rgba(0,0,0,0.12); align-self: center; height: 48px; }
    .section { font-size: 22px; font-weight: 800; margin: 8px 0 0; grid-column: 1 / -1; }
    .shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .shortcut {
      background: white; border-radius: 28px; padding: 16px; min-height: 104px;
      border: 0; text-align: left; font: inherit; cursor: pointer;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .shortcut:hover { background: #FAFAFC; }
    button, .btn { appearance: none; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; }
    input, select, textarea {
      width: 100%; padding: 14px; border-radius: 16px; border: 1px solid #E5E5EA;
      font: inherit; background: #F2F2F7;
    }
    .primary {
      background: var(--orange); color: white; width: 100%; border-radius: 16px;
      padding: 14px; font-weight: 700; margin-top: 10px;
    }
    .ghost {
      background: white; border-radius: 16px; padding: 12px 14px; font-weight: 600;
    }
    .muted { color: var(--muted); line-height: 1.45; font-size: 15px; }
    .error { color: #B42318; }
    .ok { color: #1F7A3A; }
    .pass-kind { font-size: 18px; font-weight: 800; letter-spacing: 0.04em; margin: 0 0 10px; }
    .paper {
      background: #fff; border: 2px solid #111; border-radius: 0; padding: 16px;
      text-align: left; width: 100%; box-shadow: none;
    }
    .paper.big { padding: 28px; border-width: 3px; }
    .paper-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .paper-w {
      width: 42px; height: 42px; background: var(--orange); color: #fff;
      font-weight: 800; display: grid; place-items: center; font-size: 22px; flex: none;
    }
    .paper.big .paper-w { width: 64px; height: 64px; font-size: 32px; }
    .paper-title {
      font-size: 22px; font-weight: 800; letter-spacing: 0.06em; line-height: 1.1;
    }
    .paper.big .paper-title { font-size: 34px; }
    .paper-field { margin-bottom: 8px; }
    .paper-field .lab {
      font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em;
    }
    .paper-field .val { font-size: 16px; padding-bottom: 6px; border-bottom: 1px solid #111; min-height: 28px; }
    .paper.big .paper-field .val { font-size: 20px; }
    .paper-sign { margin-top: 8px; }
    .paper-sign img { max-height: 54px; max-width: 100%; display: block; }
    .paper.big .paper-sign img { max-height: 88px; }
    .sig, .news-img { max-width: 100%; max-height: 220px; margin-top: 8px; border-radius: 12px; }
    .lunch { width: 100%; min-height: 72vh; border: 0; border-radius: 24px; background: white; }
    .search { margin-bottom: 12px; }
    nav.tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
      background: var(--tab); backdrop-filter: blur(18px);
      border-top: 1px solid var(--line);
      display: grid; grid-template-columns: repeat(3, 1fr);
      padding: 8px 10px 14px;
    }
    nav.tabs button { color: #8E8E93; font-size: 10px; font-weight: 600; padding: 6px; border-radius: 14px; }
    nav.tabs button.on { color: var(--orange); background: var(--soft); }
    nav.tabs .ico { display: grid; place-items: center; margin: 0 auto 4px; }
    nav.tabs .ico .icon { width: 22px; height: 22px; }
    .hidden { display: none !important; }
    .overlay, .sheet {
      position: fixed; inset: 0; background: var(--bg); z-index: 30; overflow: auto;
    }
    .gate-box { width: min(520px, calc(100% - 40px)); margin: 72px auto; }
    .sheet { background: rgba(0,0,0,0.28); display: grid; place-items: center; padding: 24px; }
    .sheet-card { width: min(560px, 100%); background: white; border-radius: 28px; padding: 22px; }
    .id-card {
      background: linear-gradient(160deg, #111 0%, #2A2A2A 100%);
      color: white; border-radius: 22px; padding: 22px; margin: 12px 0 16px;
    }
    .id-card .school { color: var(--orange); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    .lang { display: flex; gap: 6px; }
    .lang button { padding: 6px 10px; border-radius: 999px; background: #F2F2F7; font-size: 13px; font-weight: 700; }
    .lang button.on { background: var(--orange); color: white; }
    .staff {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%;
      background: transparent; text-align: left;
    }
    .staff:last-child { border-bottom: 0; }
    .staff:hover { color: var(--orange); }
    details.admin { background: white; border-radius: 28px; padding: 16px; }
    details.admin summary { cursor: pointer; font-weight: 700; color: var(--muted); font-size: 14px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .news-grid, .pass-grid, .people-grid {
      display: grid; gap: 14px; grid-template-columns: 1fr;
    }
    .page-head { margin-bottom: 16px; }
    @media (min-width: 820px) {
      body { display: grid; grid-template-columns: 220px 1fr; }
      .app { padding: 28px 36px 36px; }
      nav.tabs {
        position: sticky; top: 0; height: 100vh; width: 220px;
        grid-template-columns: 1fr; align-content: start; gap: 6px;
        border-top: 0; border-right: 1px solid var(--line);
        padding: 28px 14px;
      }
      nav.tabs button { font-size: 14px; text-align: left; padding: 12px 14px; display: flex; gap: 10px; align-items: center; }
      nav.tabs .ico { display: grid; margin: 0; }
      .home-grid { grid-template-columns: 1.15fr .85fr; }
      .home-grid .wide { grid-column: 1 / -1; }
      .shortcuts { grid-template-columns: repeat(4, 1fr); }
      .news-grid, .pass-grid { grid-template-columns: repeat(2, 1fr); }
      .people-grid { grid-template-columns: repeat(2, 1fr); }
      .people-grid .card { padding: 8px 16px; }
    }
    @media (min-width: 1400px) {
      .news-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>

    function normalizeRole(value) {
      const raw = String(value || "").toLowerCase().trim();
      if (raw === "administrator" || raw === "admin") return "administrator";
      if (raw === "teacher") return "teacher";
      if (raw === "parent") return "parent";
      if (raw === "student") return "student";
      if (raw === "guest") return "guest";
      return "";
    }
    function currentRole() { return normalizeRole(profile && profile.role); }
    function isGuest() { return currentRole() === "guest"; }
    function canSeePassLog() {
      const role = currentRole();
      return role === "administrator" || role === "teacher";
    }
    function signedIn() {
      if (isGuest()) return true;
      return !!(profile && profile.key && currentRole());
    }
    if (profile && !signedIn()) {
      localStorage.removeItem("whsWebProfile");
      profile = null;

      }[ch]));

      if (hour >= 5 && hour < 12) return "Good morning, " + n;
      if (hour >= 12 && hour < 17) return "Good afternoon, " + n;
      if (hour >= 17 && hour < 21) return "Good evening, " + n;
      return "Good night, " + n;

    function initials(name) {
      const parts = String(name || "W").trim().split(/\s+/);
      return ((parts[0] || "W")[0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
    }
    function roleLabel() {
      const role = currentRole();
      if (role === "administrator") return t().admin;
      if (role === "teacher") return lang === "es" ? "Maestro" : "Teacher";
      if (role === "parent") return lang === "es" ? "Padre" : "Parent";
      if (role === "student") return lang === "es" ? "Estudiante" : "Student";
      if (role === "guest") return t().guest;
      return "";
    }
    function unwrapField(field) {
      if (field == null) return "";
      if (typeof field !== "object") return String(field);
      const value = Object.prototype.hasOwnProperty.call(field, "value") ? field.value : field;
      if (value == null) return "";
      if (typeof value === "number" && value > 1000000000000) return new Date(value).toLocaleString();
      if (value && value.downloadURL) return value.downloadURL;
      return typeof value === "object" ? "" : String(value);
    }
    function fieldValue(record, key) {
      if (!record) return "";
      if (typeof record.get === "function") {
        try {
          const got = record.get(key);
          if (got != null && got !== "") return unwrapField(got);
        } catch (_) {}
      }
      if (record[key] != null && record[key] !== "") return unwrapField(record[key]);
      return unwrapField(record.fields && record.fields[key]);
    }
    function recordsFrom(response) {
      if (!response) return [];
      if (Array.isArray(response)) return response;
      if (Array.isArray(response.records)) return response.records;
      if (response.recordName) return [response];
      return [];
    }
    function normalizeCode(value) {
      return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    }
    function closeSheet() {
      sheet.classList.add("hidden");
      sheetCard.innerHTML = "";
    }
    function openSheet(html) {
      sheetCard.innerHTML = html;
      sheet.classList.remove("hidden");
    }

    async function ensureCloud() {
      const token = schoolToken();
      if (!token) return false;
      if (!configured) {
        CloudKit.configure({
          containers: [{
            containerIdentifier: CONTAINER,
            apiTokenAuth: {
              apiToken: token,
              persist: true,
              signInButton: { id: "apple-sign-in-placeholder", theme: "black" },
              signOutButton: { id: "apple-sign-out-placeholder", theme: "black" }
            },
            environment: schoolEnv()
          }]
        });
        configured = true;
        try { await CloudKit.getDefaultContainer().setUpAuth(); } catch (_) {}
      }
      return true;
    }

    async function fetchByNames(db, names) {
      const unique = [...new Set(names.filter(Boolean))];
      if (!unique.length || typeof db.fetchRecords !== "function") return [];
      const attempts = [unique, unique.map((recordName) => ({ recordName })), { records: unique.map((recordName) => ({ recordName })) }];
      for (const argument of attempts) {
        try {
          const list = recordsFrom(await db.fetchRecords(argument));
          if (list.length) return list;
        } catch (_) {}
      }
      return [];
    }

    function showGate() {
      const inProfile = signedIn();
      gate.classList.toggle("hidden", inProfile);
      gate.toggleAttribute("hidden", inProfile);
      applyChrome();
    }

    function applyChrome() {
      const c = t();
      const name = profile ? profile.displayName : "";
      hello.textContent = greeting(name);
      dateLine.textContent = new Date().toLocaleDateString(lang === "es" ? "es" : "en", {
        weekday: "long", month: "long", day: "numeric"
      });
      avatar.textContent = initials(name);
      const roleText = roleLabel();
      const gradeText = profile && profile.grade ? `${c.grade} ${profile.grade}` : "";
      roleLine.textContent = [roleText, gradeText].filter(Boolean).join(" · ");
      roleLine.classList.toggle("hidden", !roleText);
      gateTitle.textContent = c.welcome;
      gateBody.textContent = c.gateBody;
      codeLabel.textContent = c.codeLabel;
      enterSite.textContent = c.enter;
      const skip = document.getElementById("skipSite");

    function show(id) {
      view = id;
      closeSheet();
      ["home", "news", "lunch", "contacts", "more", "passes"].forEach((name) => {
        document.getElementById("view-" + name).classList.toggle("hidden", name !== id);
      });
      applyChrome();
      if (id === "home") {
        renderHome();
        if (currentRole() === "student") loadStudentPasses();
      }
      if (id === "news") loadNews();
      if (id === "lunch") renderLunch();
      if (id === "contacts") renderStaff(document.getElementById("staffQuery") ? document.getElementById("staffQuery").value : "");
      if (id === "more") renderMore();
      if (id === "passes") {
        if (!canSeePassLog()) {
          show("home");
          return;
        }
        loadPasses();
      }
    }

      return `<div class="toolbar"><button class="ghost" type="button" data-view="home">${t().back}</button></div>`;
    }

    function dashCard(go, title, subtitle) {
      return `<button class="card action" type="button" data-go="${go}"><div class="t">${title}</div>${subtitle ? `<div class="s">${subtitle}</div>` : ""}</button>`;

          ${dashCard("news", c.openNews, "")}

    function answerAsk(raw) {
      const q = String(raw || "").trim().toLowerCase();
      const out = document.getElementById("askOut");
      if (!out) return;
      const c = t();
      if (!q) { out.textContent = c.askEmpty; return; }
      if (/lunch|almuerzo|menu|menú/.test(q)) {
        out.innerHTML = `<button class="primary" type="button" data-go="lunch">${c.openLunch}</button>`;
        return;
      }
      if (/news|noticia|agenda|calendar|calendario/.test(q)) {
        out.innerHTML = `<button class="primary" type="button" data-go="news">${c.openNews}</button>`;
        return;
      }
      if (/pass|pase|hallway|flex/.test(q)) {
        out.textContent = c.passesHint;
        return;
      }
      if (/attendance|asistencia/.test(q)) {
        out.innerHTML = `<a class="primary" style="display:block;text-align:center;text-decoration:none;" href="mailto:whsattendance@watertownps.org">${c.attendance}</a>`;
        return;
      }
      const hits = staff.filter((person) => `${person.name} ${person.group} ${person.email}`.toLowerCase().includes(q)).slice(0, 6);
      if (hits.length) {
        out.innerHTML = hits.map(personButton).join("");
        return;
      }
      out.textContent = c.askEmpty;
    }

    function passPaper(record, enlarged) {
      const c = t();
      const kind = fieldValue(record, "kind") === "flex" ? c.flex : c.hallway;

        <div class="paper-field"><div class="lab">${c.studentNameLabel}</div><div class="val">${escapeHtml(fieldValue(record, "studentName"))}</div></div>
        <div class="paper-field"><div class="lab">${c.destinationLabel}</div><div class="val">${escapeHtml(fieldValue(record, "destination"))}</div></div>
        <div class="paper-field"><div class="lab">${c.datesLabel}</div><div class="val">${escapeHtml(fieldValue(record, "dates"))}</div></div>
        <div class="paper-sign">
          <div class="lab">${c.signature}</div>
          ${signature ? `<img alt="" src="${escapeHtml(signature)}">` : ""}
          <div class="s">${escapeHtml(fieldValue(record, "teacherName"))}</div>
        </div>
      </article>`;

    async function loadStudentPasses() {
      const node = document.getElementById("studentPasses");
      const c = t();
      if (!node || currentRole() !== "student" || !profile || !profile.key) return;
      node.innerHTML = `<p class="muted">${c.yourPasses}</p>`;
      if (!(await ensureCloud())) {
        node.innerHTML = `<p class="muted">${c.noStudentPasses}</p>`;
        return;
      }
      try {
        const db = CloudKit.getDefaultContainer().publicCloudDatabase;
        const profiles = await fetchByNames(db, [profile.key]);
        const mine = profiles.find((item) => normalizeCode(item.recordName) === profile.key);
        const ids = String(fieldValue(mine, "passIDs") || "").split(",").map((part) => part.trim()).filter(Boolean);
        const records = await fetchByNames(db, ids);
        const usable = records.filter((record) => fieldValue(record, "studentName") || fieldValue(record, "teacherName"));
        if (!usable.length) {
          node.innerHTML = `<p class="muted">${c.noStudentPasses}</p>`;
          return;
        }
        window._studentPasses = {};
        node.innerHTML = usable.map((record) => {
          const id = record.recordName || fieldValue(record, "recordName") || String(Math.random());
          window._studentPasses[id] = record;
          return `<button type="button" class="action" style="margin-bottom:12px;" data-action="openStudentPass" data-pass-id="${escapeHtml(id)}">${passPaper(record, false)}</button>`;
        }).join("");
      } catch (error) {
        node.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
      }
    }

    function openStudentPass(id) {
      const record = window._studentPasses && window._studentPasses[id];
      if (!record) return;
      openSheet(`
        <div class="card-title"><button type="button" data-action="closeSheet">${t().close}</button></div>
        ${passPaper(record, true)}`);
    }

    async function loadNews() {
      const node = document.getElementById("view-news");
      const c = t();
      node.innerHTML = `${backBar()}<p class="muted">${c.newsEmpty}</p>`;
      if (!(await ensureCloud())) {
        node.innerHTML = `${backBar()}<div class="card"><p class="muted">${c.newsNeedToken}</p><button class="primary" type="button" data-go="more">${c.more}</button></div>`;
        return;
      }
      try {
        const queried = await CloudKit.getDefaultContainer().publicCloudDatabase.performQuery({ recordType: NEWS_TYPE });
        const usable = recordsFrom(queried).filter((r) => Number(fieldValue(r, "published") || 1) !== 0);
        if (!usable.length) {
          node.innerHTML = `${backBar()}<div class="card"><p class="muted">${c.newsEmpty}</p></div>`;
          return;
        }
        node.innerHTML = backBar() + `<div class="news-grid">` + usable.map((record) => {
          const heading = lang === "es" ? (fieldValue(record, "titleES") || fieldValue(record, "titleEN")) : (fieldValue(record, "titleEN") || fieldValue(record, "titleES"));
          const body = lang === "es" ? (fieldValue(record, "subtitleES") || fieldValue(record, "subtitleEN")) : (fieldValue(record, "subtitleEN") || fieldValue(record, "subtitleES"));
          const image = fieldValue(record, "image");
          return `<article class="card"><b>${escapeHtml(heading)}</b><p class="muted">${escapeHtml(body)}</p>${image ? `<img class="news-img" alt="" src="${escapeHtml(image)}">` : ""}</article>`;
        }).join("") + `</div>`;
      } catch (error) {
        node.innerHTML = `${backBar()}<p class="error">${escapeHtml(error.message)}</p>`;
      }
    }

    async function loadPasses() {
      const node = document.getElementById("view-passes");
      const c = t();
      node.innerHTML = `<div class="toolbar"><button class="ghost" type="button" data-view="more">${c.back}</button><button class="ghost" type="button" id="refreshPasses">${c.refresh}</button></div><div id="passes"></div>`;
      if (!(await ensureCloud())) {
        node.insertAdjacentHTML("beforeend", `<div class="card"><p class="muted">${c.adminHint}</p></div>`);
        return;
      }
      const seen = new Map();
      const remember = (record) => { if (record && record.recordName) seen.set(record.recordName, record); };
      try {
        const db = CloudKit.getDefaultContainer().publicCloudDatabase;
        (await fetchByNames(db, [MANIFEST])).forEach(remember);
        const raw = seen.get(MANIFEST) ? fieldValue(seen.get(MANIFEST), "passIDs") : "";
        (await fetchByNames(db, raw.split(",").map((part) => part.trim()))).forEach(remember);
        try { recordsFrom(await db.performQuery({ recordType: PASS_TYPE })).forEach(remember); } catch (_) {}
        const usable = [...seen.values()].filter((r) => r.recordName !== MANIFEST && (fieldValue(r, "studentName") || fieldValue(r, "teacherName")));
        document.getElementById("passes").innerHTML = usable.length ? `<div class="pass-grid">` + usable.map((record) => {
          const kind = fieldValue(record, "kind") === "flex" ? c.flex : c.hallway;
          const signature = fieldValue(record, "signature");
          return `<article class="card"><p class="pass-kind">${kind}</p>
            <div class="t">${escapeHtml(fieldValue(record, "studentName"))}</div>
            <div class="s">${escapeHtml(fieldValue(record, "destination"))}</div>
            <div class="s">${escapeHtml(fieldValue(record, "teacherName"))}</div>
            ${signature ? `<img class="sig" alt="" src="${escapeHtml(signature)}">` : ""}</article>`;
        }).join("") + `</div>` : `<div class="card"><p class="muted">${c.emptyPasses}</p></div>`;
      } catch (error) {
        node.insertAdjacentHTML("beforeend", `<p class="error">${escapeHtml(error.message)}</p>`);
      }
    }

    async function enterWithCode() {
      gateError.textContent = "";
      const key = normalizeCode(webCode.value);
      if (key.length < 8) {
        gateError.textContent = t().gateFail;
        return;
      }
      if (!(await ensureCloud())) {
        gateError.textContent = t().gateFail;
        return;
      }
      try {
        const records = await fetchByNames(CloudKit.getDefaultContainer().publicCloudDatabase, [key]);
        const record = records.find((item) => normalizeCode(item.recordName) === key);
        if (!record) {
          gateError.textContent = t().gateFail;
          return;
        }
        const role = normalizeRole(fieldValue(record, "role"));
        if (!role) {
          gateError.textContent = t().gateFail;
          return;
        }
        profile = {
          displayName: fieldValue(record, "displayName") || fieldValue(record, "firstName") || "Warrior",
          firstName: fieldValue(record, "firstName") || "",
          role,
          grade: fieldValue(record, "grade") || "",
          key
        };
        localStorage.setItem("whsWebProfile", JSON.stringify(profile));
        showGate();
        show("home");
      } catch (error) {
        gateError.textContent = error.message || t().gateFail;
      }
    }

    fetch("./staff.json").then((res) => res.json()).then((data) => {
      staff = data;
      if (view === "contacts") renderStaff("");
    }).catch(() => {});

    document.body.addEventListener("click", (event) => {
      const mail = event.target.closest("[data-mail]");
      if (mail && mail.dataset.mail) {
        window.location.href = mail.dataset.mail;
        return;
      }
      const action = event.target.closest("[data-action]");
      if (action) {
        const name = action.dataset.action;
        if (name === "swipe") openSwipe();
        if (name === "passesInfo") openPassesInfo();
        if (name === "ask") openAsk("");
        if (name === "aide") openAide();
        if (name === "askGo") answerAsk(document.getElementById("askBox") && document.getElementById("askBox").value);
        if (name === "closeSheet") closeSheet();
        if (name === "openStudentPass") openStudentPass(action.dataset.passId || "");
      }
      const go = event.target.closest("[data-go]");
      if (go) show(go.dataset.go);
      const tab = event.target.closest("button[data-view]");
      if (tab) show(tab.dataset.view);
      if (event.target.id === "en") { lang = "en"; localStorage.setItem("whsAdminLang", lang); show(view); }
      if (event.target.id === "es") { lang = "es"; localStorage.setItem("whsAdminLang", lang); show(view); }
      if (event.target.id === "signOutProfile") {
        localStorage.removeItem("whsWebProfile");
        profile = null;
        showGate();
      }
      if (event.target.id === "saveToken") {
        localStorage.setItem("whsAdminToken", document.getElementById("token").value.trim());
        localStorage.setItem("whsAdminEnv", document.getElementById("env").value);
        configured = false;
        const note = document.getElementById("tokenSaved");
        if (note) { note.textContent = t().tokenSaved; note.classList.remove("hidden"); }
      }
      if (event.target.id === "openPasses") show("passes");
      if (event.target.id === "refreshPasses") loadPasses();
      if (event.target.closest("#bell")) show("news");
      if (event.target.closest("#me")) show("more");
      if (event.target.id === "skipSite" || event.target.closest("#skipSite")) enterGuest();
      if (event.target.id === "enterSite" || event.target.closest("#enterSite")) enterWithCode();
    });
    document.body.addEventListener("input", (event) => {
      if (event.target.id === "staffQuery") renderStaff(event.target.value);
    });
    document.body.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && event.target.id === "askBox") {
        event.preventDefault();
        answerAsk(event.target.value);
      }
      if (event.key === "Enter" && event.target.id === "webCode") {
        event.preventDefault();
        enterWithCode();
      }
      if (event.key === "Escape") closeSheet();
    });
    sheet.addEventListener("click", (event) => {
      if (event.target === sheet) closeSheet();
    });
    function enterGuest() {
      profile = { displayName: "Warrior", role: "guest", grade: "", key: "" };
      localStorage.setItem("whsWebProfile", JSON.stringify(profile));
      showGate();
      show("home");
    }
    window.show = show;
    window.openSwipe = openSwipe;
    window.openAsk = openAsk;
    window.openAide = openAide;
    window.openPassesInfo = openPassesInfo;
    showGate();
    if (signedIn()) show("home");
  </script>
</body>
</html>
